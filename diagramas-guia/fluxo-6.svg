<svg xmlns="http://www.w3.org/2000/svg" width="640" height="674" viewBox="0 0 640 674" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Fluxo Pix direto negociado (Admin → Admin → App)"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2383E2"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9730D"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#787774"/></marker></defs><rect width="640" height="674" fill="#fff"/><text x="0" y="22" font-size="18" font-weight="700" fill="#2383E2">APP (representante)</text><text x="640" y="22" font-size="18" font-weight="700" text-anchor="end" fill="#D9730D">ADMIN (empresa)</text><rect x="350" y="50" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="78" font-size="16" fill="#37352F" >1. ADM-13: diretoria define a</text><text x="362" y="100" font-size="16" fill="#37352F" >negociação (ex.: Thalita 100%)</text><text x="362" y="122" font-size="16" fill="#787774" >→ NEGPIX_SET</text><rect x="0" y="166" width="290" height="104" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="194" font-size="16" fill="#37352F" >2. APP-14.5: pagamento da</text><text x="12" y="216" font-size="16" fill="#37352F" >revendedora na forma Pix</text><text x="12" y="238" font-size="16" fill="#37352F" >representante</text><text x="12" y="260" font-size="16" fill="#787774" >→ acertoForm.pagamentos</text><path d="M495 132 L495 146 L145 152 L145 166" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="304" width="290" height="104" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="332" font-size="16" fill="#37352F" >3. ADM-09: financeiro confirma</text><text x="362" y="354" font-size="16" fill="#37352F" >e indica a representante que</text><text x="362" y="376" font-size="16" fill="#37352F" >recebeu</text><text x="362" y="398" font-size="16" fill="#787774" >→ fin.rep</text><path d="M145 270 L145 284 L495 290 L495 304" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="350" y="442" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="470" font-size="16" fill="#37352F" >4. ADM-10 Pix direto a enviar:</text><text x="362" y="492" font-size="16" fill="#37352F" >sobe 'Já enviado', cai 'Falta'</text><text x="362" y="514" font-size="16" fill="#787774" >→ resumoPix()</text><line x1="495" y1="408" x2="495" y2="442" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="558" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="586" font-size="16" fill="#37352F" >5. APP-22: o Pix entra como 'Já</text><text x="12" y="608" font-size="16" fill="#37352F" >pago'</text><text x="12" y="630" font-size="16" fill="#787774" >→ pagoDireto</text><path d="M495 524 L495 538 L145 544 L145 558" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/></svg>