<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Fluxo Combustível e gasolina (App → Admin → App)"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2383E2"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9730D"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#787774"/></marker></defs><rect width="640" height="580" fill="#fff"/><text x="0" y="22" font-size="18" font-weight="700" fill="#2383E2">APP (representante)</text><text x="640" y="22" font-size="18" font-weight="700" text-anchor="end" fill="#D9730D">ADMIN (empresa)</text><rect x="0" y="50" width="290" height="104" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="78" font-size="16" fill="#37352F" >1. APP-22: representante envia</text><text x="12" y="100" font-size="16" fill="#37352F" >o km total até 13h do dia</text><text x="12" y="122" font-size="16" fill="#37352F" >anterior</text><text x="12" y="144" font-size="16" fill="#787774" >→ COMIS_FECH {km}</text><rect x="350" y="188" width="290" height="104" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="216" font-size="16" fill="#37352F" >2. ADM-09 Comissões: financeiro</text><text x="362" y="238" font-size="16" fill="#37352F" >atualiza o preço do litro</text><text x="362" y="260" font-size="16" fill="#37352F" >(Gasolina PR)</text><text x="362" y="282" font-size="16" fill="#787774" >→ COMIS_GAS</text><path d="M145 154 L145 168 L495 174 L495 188" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="326" width="290" height="126" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="354" font-size="16" fill="#37352F" >3. APP-22: aviso 'Combustível</text><text x="12" y="376" font-size="16" fill="#37352F" >atualizado' + combustível</text><text x="12" y="398" font-size="16" fill="#37352F" >recalculado</text><text x="12" y="420" font-size="16" fill="#787774" >→ COMIS_GAS_VISTO ao tocar em</text><text x="12" y="442" font-size="16" fill="#787774" >Entendi</text><path d="M495 292 L495 306 L145 312 L145 326" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="486" width="290" height="60" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="514" font-size="16" fill="#37352F" >4. ADM-09: paga na data</text><text x="362" y="536" font-size="16" fill="#787774" >→ c.fech pagamentos</text><path d="M145 452 L145 466 L495 472 L495 486" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/></svg>