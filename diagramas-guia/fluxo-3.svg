<svg xmlns="http://www.w3.org/2000/svg" width="640" height="862" viewBox="0 0 640 862" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Fluxo Kit novo (Admin → App → Admin)"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2383E2"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9730D"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#787774"/></marker></defs><rect width="640" height="862" fill="#fff"/><text x="0" y="22" font-size="18" font-weight="700" fill="#2383E2">APP (representante)</text><text x="640" y="22" font-size="18" font-weight="700" text-anchor="end" fill="#D9730D">ADMIN (empresa)</text><rect x="350" y="50" width="290" height="104" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="78" font-size="16" fill="#37352F" >1. ADM-17.1: direciona a</text><text x="362" y="100" font-size="16" fill="#37352F" >revendedora nova para a</text><text x="362" y="122" font-size="16" fill="#37352F" >representante</text><text x="362" y="144" font-size="16" fill="#787774" >→ s.novas.status = direcionada</text><rect x="0" y="188" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="216" font-size="16" fill="#37352F" >2. APP-08 Kits Novos → APP-04 →</text><text x="12" y="238" font-size="16" fill="#37352F" >APP-18 Entrega do kit novo</text><text x="12" y="260" font-size="16" fill="#787774" >→ 16 etapas com dois checks</text><path d="M495 154 L495 168 L145 174 L145 188" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="0" y="304" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="332" font-size="16" fill="#37352F" >3. APP-19 Conferir as peças</text><text x="12" y="354" font-size="16" fill="#787774" >→ s.confBip; faltas viram erro</text><text x="12" y="376" font-size="16" fill="#787774" >de bipagem</text><line x1="145" y1="270" x2="145" y2="304" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="0" y="420" width="290" height="60" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="448" font-size="16" fill="#37352F" >4. APP-20 Resumo da entrega</text><text x="12" y="470" font-size="16" fill="#787774" >→ KN_ENT_CONCLUIR</text><line x1="145" y1="386" x2="145" y2="420" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="514" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="542" font-size="16" fill="#37352F" >5. ADM-17.3 Consolidado; ADM-19</text><text x="362" y="564" font-size="16" fill="#37352F" >Controle de expositores (foto)</text><text x="362" y="586" font-size="16" fill="#787774" >→ s.entregasKN; foto</text><path d="M145 480 L145 494 L495 500 L495 514" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="350" y="630" width="290" height="104" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="658" font-size="16" fill="#37352F" >6. ADM-06 / ADM-09: comissão R$</text><text x="362" y="680" font-size="16" fill="#37352F" >20 (R$ 35 com expositor) com</text><text x="362" y="702" font-size="16" fill="#37352F" >condicional assinada</text><text x="362" y="724" font-size="16" fill="#787774" >→ item 'kitnovo'</text><line x1="495" y1="596" x2="495" y2="630" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="768" width="290" height="60" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="796" font-size="16" fill="#37352F" >7. APP-22 Comissões</text><text x="12" y="818" font-size="16" fill="#787774" >→ linha de kit novo</text><path d="M495 734 L495 748 L145 754 L145 768" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/></svg>