<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de bruto · Quadro e Planilha</title>
<style>
  *{ box-sizing:border-box; margin:0; }
  :root{ --bg:#0F0F0F; --cx:#16161A; --fio:rgba(255,255,255,.12); --txt:#fff; --az:#3B82F6; --az2:#1E4E8C; --azc:#BFDBFE; --ok:#4ADE80; --at:#FBBF24; --ruim:#EF4444; }
  body{ background:#000; color:var(--txt); font:13px/1.4 Inter,system-ui,"Segoe UI",Arial,sans-serif; padding:16px; font-variant-numeric:tabular-nums; }
  h1{ font-size:18px; } .sub{ margin:2px 0 14px; max-width:980px; }
  .opcao{ margin-bottom:34px; } .opcao > .rot{ font-weight:700; font-size:15px; } .opcao > .dica{ margin:2px 0 8px; max-width:980px; }
  .tela{ background:var(--bg); border:1px solid var(--fio); border-radius:12px; overflow:hidden; }
  /* topo do sistema: faixa, menu, tela */
  .faixa{ display:flex; align-items:center; gap:10px; height:36px; padding:0 14px; border-bottom:1px solid var(--fio); background:#111114; }
  .faixa b{ font-size:13px; } .ic{ width:20px; height:20px; border-radius:6px; background:var(--az); display:inline-block; }
  .menu{ display:flex; align-items:center; gap:2px; height:34px; padding:0 10px; border-bottom:1px solid var(--fio); overflow:hidden; }
  .menu span{ padding:0 12px; height:30px; display:flex; align-items:center; border-radius:6px; white-space:nowrap; } .menu span.on{ background:rgba(59,130,246,.22); color:#fff; font-weight:700; box-shadow:inset 0 -2px 0 var(--az); }
  .menu .esp{ flex:1; padding:0; } .busca-tela{ border:1px solid var(--fio); border-radius:6px; height:26px; padding:0 10px; display:flex; align-items:center; }
  .corpo{ padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .pagehead{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .pagehead .tt{ flex:1; min-width:220px; } .pagehead h2{ font-size:18px; line-height:1.2; } .pagehead p{ font-size:13px; }
  .seg{ display:inline-flex; border:1px solid var(--fio); border-radius:8px; overflow:hidden; } .seg span{ height:32px; display:flex; align-items:center; padding:0 14px; } .seg span.on{ background:var(--az); font-weight:700; }
  button,select,input{ font:inherit; color:#fff; background:var(--cx); border:1px solid var(--fio); border-radius:8px; height:32px; padding:0 10px; outline:none; min-width:0; } select option{ color:#111; }
  button{ cursor:pointer; min-width:96px; } button:hover{ border-color:var(--az); } button.pri{ background:var(--az); border-color:var(--az); font-weight:700; } button[disabled]{ opacity:.45; cursor:default; }
  /* faixa de totais */
  .totais{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); border:1px solid var(--fio); border-radius:10px; background:var(--cx); }
  .totais > div{ padding:7px 6px; text-align:center; border-right:1px solid var(--fio); min-width:0; } .totais > div:last-child{ border:0; }
  .totais small{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .totais b{ font-size:18px; white-space:nowrap; }
  .v-ok{ color:var(--ok); } .v-at{ color:var(--at); } .v-ruim{ color:#F87171; }
  /* filtros */
  .filtros{ border:1px solid var(--fio); border-radius:10px; background:var(--cx); } .filtros > .tt{ text-align:center; font-size:11px; text-transform:uppercase; letter-spacing:.07em; padding:5px 0; border-bottom:1px solid var(--fio); background:linear-gradient(90deg,var(--az2),var(--az),var(--azc)); font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .filtros .g{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px 10px; padding:8px 10px; } .filtros label{ display:flex; flex-direction:column; gap:2px; font-size:11px; min-width:0; } .filtros .dois{ grid-column:span 2; } .filtros .fim{ display:flex; align-items:flex-end; justify-content:flex-end; gap:8px; }
  .bloco{ border:1px solid var(--fio); border-radius:10px; background:var(--cx); overflow:hidden; } .bloco > .tt{ text-align:center; font-size:12px; font-weight:700; padding:6px 0; background:linear-gradient(90deg,var(--az2),var(--az),var(--azc)); text-shadow:0 1px 2px rgba(0,0,0,.5); }
  /* etiqueta de fornecedor */
  .tag{ display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:6px; font-weight:700; font-size:12px; white-space:nowrap; border:1px solid transparent; }
  .tag.sem{ border-color:rgba(255,255,255,.55); background:transparent; }
  .chip{ display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid; white-space:nowrap; }
  .c-p{ border-color:#3B82F6; background:rgba(59,130,246,.18); } .c-e{ border-color:#EF4444; background:rgba(239,68,68,.16); } .c-n{ border-color:var(--fio); background:rgba(255,255,255,.07); }
  .c-at{ border-color:rgba(239,68,68,.6); background:rgba(239,68,68,.2); } .c-ok{ border-color:rgba(74,222,128,.55); background:rgba(74,222,128,.16); }
  /* A: kanban */
  .kan{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; align-items:start; }
  .col{ border:1px solid var(--fio); border-top:3px solid var(--az); border-radius:10px; background:var(--cx); padding:6px; display:flex; flex-direction:column; gap:6px; min-width:0; } .col.fim{ border-top-color:var(--ok); }
  .col .ch{ text-align:center; padding:2px 0 4px; } .col .ch b{ display:block; font-size:13px; } .col .ch small{ font-size:11px; }
  .card{ border:1px solid var(--fio); border-radius:9px; overflow:hidden; background:#1c1c21; }
  .card .fx{ display:flex; align-items:center; justify-content:space-between; padding:4px 8px; font-weight:700; } .card .fx i{ font-style:normal; font-size:12px; } .card .fx i.at{ background:rgba(239,68,68,.9); border-radius:6px; padding:0 6px; }
  .card .ct{ padding:6px 8px; display:flex; flex-direction:column; gap:5px; } .card .l{ display:flex; justify-content:space-between; gap:6px; align-items:center; } .card .val{ font-size:16px; font-weight:700; }
  .card .ac{ display:flex; gap:6px; } .card .ac button{ height:32px; flex:1; padding:0 6px; } .card .ac select{ width:50%; padding:0 2px; text-overflow:ellipsis; }
  .vazio{ text-align:center; padding:12px 0; }
  /* B: planilha */
  .rolar{ overflow-x:auto; } table{ width:100%; border-collapse:collapse; }
  th{ height:30px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; padding:0 8px; text-align:left; white-space:nowrap; background:rgba(255,255,255,.05); } th.n,td.n{ text-align:right; }
  td{ height:32px; padding:0 8px; border-top:1px solid var(--fio); white-space:nowrap; } tr.at td{ background:rgba(239,68,68,.08); } tr.tot td{ font-weight:700; border-top:2px solid var(--fio); background:rgba(255,255,255,.05); }
  .passos{ display:inline-flex; align-items:center; gap:3px; } .passos i{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(255,255,255,.5); display:inline-block; } .passos i.f{ background:var(--az); border-color:var(--az); } .passos i.a{ background:var(--at); border-color:var(--at); } .passos i.c{ background:var(--ok); border-color:var(--ok); } .passos span{ margin-left:6px; }
  td button{ height:26px; min-width:0; padding:0 8px; }
  /* C: mapa por fornecedor */
  .teto{ padding:8px 12px; display:flex; flex-direction:column; gap:5px; } .teto .barra{ height:16px; border-radius:8px; background:rgba(255,255,255,.1); overflow:hidden; position:relative; display:flex; } .teto .barra div{ height:100%; } .teto .lin{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .marca{ position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.55); }
  .mapa td.cel{ text-align:center; cursor:pointer; height:44px; } .mapa td.cel:hover{ background:rgba(59,130,246,.18); } .mapa td.cel.sel{ background:rgba(59,130,246,.3); box-shadow:inset 0 0 0 1px var(--az); } .mapa td.cel b{ display:block; font-size:13px; line-height:1.15; } .mapa td.cel small{ font-size:11px; }
  .mapa td.nome{ cursor:pointer; } .mapa td.nome:hover{ background:rgba(59,130,246,.12); } .z{ color:rgba(255,255,255,.35); }
  /* D: lista + ficha */
  .duas{ display:grid; grid-template-columns:minmax(300px,380px) minmax(0,1fr); gap:10px; align-items:start; }
  .lista .gr{ padding:4px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; background:rgba(255,255,255,.06); border-top:1px solid var(--fio); display:flex; justify-content:space-between; }
  .lista .li{ display:flex; align-items:center; gap:8px; height:34px; padding:0 10px; border-top:1px solid var(--fio); cursor:pointer; } .lista .li:hover{ background:rgba(59,130,246,.12); } .lista .li.sel{ background:rgba(59,130,246,.28); box-shadow:inset 3px 0 0 var(--az); } .lista .li .v{ margin-left:auto; font-weight:700; }
  .ficha{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); } .ficha > div{ padding:10px 12px; border-right:1px solid var(--fio); min-width:0; display:flex; flex-direction:column; gap:6px; } .ficha > div:last-child{ border:0; }
  .ficha h4{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; text-align:center; padding-bottom:4px; border-bottom:1px solid var(--fio); }
  .par{ display:grid; grid-template-columns:auto 1fr; gap:2px 10px; } .par > span:nth-child(odd){ font-size:11px; text-transform:uppercase; letter-spacing:.04em; align-self:center; } .par > span:nth-child(even){ text-align:right; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl{ display:flex; flex-direction:column; gap:0; } .tl .p{ display:grid; grid-template-columns:18px 1fr; gap:8px; padding:4px 0; position:relative; } .tl .p:not(:last-child)::before{ content:""; position:absolute; left:8px; top:22px; bottom:-4px; width:1px; background:var(--fio); }
  .tl .bola{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.5); margin-top:2px; } .tl .f .bola{ background:var(--ok); border-color:var(--ok); } .tl .a .bola{ background:var(--az); border-color:var(--az); box-shadow:0 0 0 4px rgba(59,130,246,.3); } .tl .n .bola{ border-style:dashed; }
  .tl b{ display:block; } .tl small{ font-size:11px; }
  .acoes{ display:flex; flex-direction:column; gap:6px; } .acoes button{ width:100%; } textarea{ font:inherit; color:#fff; background:var(--cx); border:1px solid var(--fio); border-radius:8px; padding:6px 8px; min-height:56px; resize:none; width:100%; }
  @media(max-width:900px){ .totais{ grid-template-columns:repeat(3,minmax(0,1fr)); } .totais > div:nth-child(3){ border-right:0; } .filtros .g{ grid-template-columns:repeat(2,minmax(0,1fr)); } .duas{ grid-template-columns:1fr; } .ficha{ grid-template-columns:1fr; } .ficha > div{ border-right:0; border-bottom:1px solid var(--fio); } }
</style>
</head>
<body>
<h1>Pedidos de bruto · Quadro e Planilha juntos</h1>
<p class="sub">Layout escolhido pelo Marcus em 29/10/2026 (opções A e B). Tela 1 de 8 do setor Cadastro de peças. Troque entre Quadro e Planilha no botão do alto. Dados de exemplo, inventados. Concluir e Mover funcionam; os filtros valem para as duas visões.</p>
<div class="tela" id="T"></div>
<script>
var FORN = {"Pontual":"#3B82F6","Mega Sul":"#22C55E","Point":"#F97316","Art Ello":"#8B5CF6","Ellos":"#EF4444","Xangai":"#14B8A6"}; /* sem cor definida: contorno simples (Linda, Tucano, Charme) */
var ETAPAS = [ {n:"Escolha",pz:null,txt:"sem prazo"}, {n:"Separação",pz:5,txt:"prazo 5 dias"}, {n:"Fechado",pz:2,txt:"prazo 2 dias"}, {n:"Banho",pz:10,txt:"prazo 10 dias"}, {n:"Chegou",pz:null,txt:"na Sorelly"} ];
var TETO = 100000;
var P = [
 {id:1, f:"Point",    rom:"",       et:0, lista:18420.00, d:20, pc:640, banho:"Pontual", cnpj:"34", nota:60, dias:1},
 {id:2, f:"Xangai",   rom:"",       et:1, lista:9870.50,  d:15, pc:310, banho:"Ellos",   cnpj:"46", nota:50, dias:6},
 {id:3, f:"Mega Sul", rom:"",       et:0, lista:6240.00,  d:18, pc:250, banho:"Pontual", cnpj:"59", nota:70, dias:2},
 {id:4, f:"Art Ello", rom:"144459", et:2, lista:12300.00, d:15, pc:420, banho:"Ellos",   cnpj:"34", nota:60, dias:1},
 {id:5, f:"Point",    rom:"031892", et:2, lista:21760.00, d:25, pc:800, banho:"Pontual", cnpj:"67", nota:50, dias:2},
 {id:6, f:"Linda",    rom:"144502", et:3, lista:7480.00,  d:10, pc:190, banho:"Ellos",   cnpj:"46", nota:60, dias:6},
 {id:7, f:"Point",    rom:"031640", et:3, lista:15390.00, d:20, pc:520, banho:"Pontual", cnpj:"34", nota:60, dias:11},
 {id:8, f:"Xangai",   rom:"008821", et:4, lista:8115.00,  d:15, pc:280, banho:"Ellos",   cnpj:"59", nota:50, dias:0},
 {id:9, f:"Tucano",   rom:"002017", et:3, lista:3060.00,  d:12, pc:90,  banho:"Ellos",   cnpj:"46", nota:70, dias:4}
];
var F = {q:"", forn:"", banho:"", cnpj:"", sit:""}; var SELD = 5, SELC = null;

function brl(n){ return "R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pagar(p){ return p.lista*(1-p.d/100); }
function nota(p){ return pagar(p)*p.nota/100; } function pix(p){ return pagar(p)-nota(p); }
function atras(p){ var z=ETAPAS[p.et].pz; return z!=null && p.dias>z; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function tag(f){ var c=FORN[f]; return c ? '<span class="tag" style="background:'+c+'">'+esc(f)+'</span>' : '<span class="tag sem">'+esc(f)+'</span>'; }
function bchip(b){ return '<span class="chip '+(b==="Pontual"?"c-p":"c-e")+'">'+b+'</span>'; }
function vis(){ return P.filter(function(p){
  if(F.q && (p.f+" "+p.rom+" "+p.banho).toLowerCase().indexOf(F.q.toLowerCase())<0) return false;
  if(F.forn && p.f!==F.forn) return false; if(F.banho && p.banho!==F.banho) return false; if(F.cnpj && p.cnpj!==F.cnpj) return false;
  if(F.sit==="atr" && !atras(p)) return false; if(F.sit==="aber" && p.et===4) return false; return true; }); }
function avancar(id){ var p=P.filter(function(x){return x.id===id;})[0]; if(!p||p.et>=4) return; if(p.et===1 && !p.rom) p.rom=String(10000+Math.floor(Math.random()*89999)); p.et++; p.dias=0; desenhar(); }
function mover(id,et){ var p=P.filter(function(x){return x.id===id;})[0]; if(!p) return; et=+et; if(et===p.et) return; if(et>=2 && !p.rom){ alert("Informe o romaneio antes de fechar o pedido."); desenhar(); return; } p.et=et; p.dias=0; desenhar(); }

/* peças comuns */
function topo(seg, btn){
  return '<div class="faixa"><span class="ic"></span><b>Cadastro de peças</b></div>'
   +'<div class="menu"><span>Compras</span><span class="on">Pedidos</span><span>Banho</span><span>Lotes</span><span>Fornecedores</span><span>Pagamento</span><span>Ouro</span><span>Config</span><span class="esp"></span><div class="busca-tela">Buscar tela…</div></div>'
   +'<div class="corpo"><div class="pagehead"><div class="tt"><h2>Pedidos</h2><p>Da escolha das peças até a chegada na Sorelly.</p></div>'+(seg||"")+'<button class="pri">+ Novo pedido</button></div>';
}
function segm(ativo){ return '<div class="seg"><span class="'+(ativo==="q"?"on":"")+'">Quadro</span><span class="'+(ativo==="p"?"on":"")+'">Planilha</span></div>'; }
function totais(){
  var l=vis(), ab=l.filter(function(p){return p.et<4;}), tot=l.reduce(function(s,p){return s+pagar(p);},0), ba=l.filter(function(p){return p.et===3;}).length,
      at=l.filter(atras).length, pc=l.reduce(function(s,p){return s+p.pc;},0), folga=TETO-P.reduce(function(s,p){return s+pagar(p);},0);
  return '<div class="totais"><div><small>Abertos</small><b>'+ab.length+'</b></div><div><small>Comprado</small><b>'+brl(tot)+'</b></div><div><small>Folga do teto</small><b class="'+(folga<0?"v-ruim":"v-ok")+'">'+brl(folga)+'</b></div><div><small>No banho</small><b>'+ba+'</b></div><div><small>Atrasados</small><b class="'+(at?"v-ruim":"")+'">'+at+'</b></div><div><small>Peças</small><b>'+pc.toLocaleString("pt-BR")+'</b></div></div>';
}
function filtros(){
  var forns=Object.keys(FORN).concat(["Linda","Tucano","Charme"]);
  return '<div class="filtros"><div class="tt">Filtros</div><div class="g">'
   +'<label class="dois">Busca<input class="fq" placeholder="Fornecedor, romaneio ou banho" value="'+esc(F.q)+'"></label>'
   +'<label>Fornecedor<select class="ff"><option value="">Todos</option>'+forns.map(function(x){return '<option'+(F.forn===x?" selected":"")+'>'+x+'</option>';}).join("")+'</select></label>'
   +'<label>Banho<select class="fb"><option value="">Todos</option><option'+(F.banho==="Pontual"?" selected":"")+'>Pontual</option><option'+(F.banho==="Ellos"?" selected":"")+'>Ellos</option></select></label>'
   +'<label>CNPJ pagador<select class="fc"><option value="">Todos</option>'+["34","46","59","67"].map(function(x){return '<option'+(F.cnpj===x?" selected":"")+'>'+x+'</option>';}).join("")+'</select></label>'
   +'<label>Situação<select class="fs"><option value="">Todos</option><option value="aber"'+(F.sit==="aber"?" selected":"")+'>Em aberto</option><option value="atr"'+(F.sit==="atr"?" selected":"")+'>Atrasados</option></select></label>'
   +'<label>Mês<select><option>Outubro 2026</option></select></label>'
   +'<div class="fim"><button class="fl">Limpar</button></div></div></div>';
}
function botao(p){
  if(p.et===4) return '<button disabled>Concluído</button>';
  return '<button class="pri" title="'+(p.et===1?"Informar o romaneio e fechar o pedido":"Concluir etapa")+'" onclick="avancar('+p.id+')">'+(p.et===1?"Romaneio ›":"Concluir ›")+'</button>';
}
function selMover(p){ return '<select title="Mover para…" onchange="mover('+p.id+',this.value)">'+ETAPAS.map(function(e,i){return '<option value="'+i+'"'+(i===p.et?" selected":"")+'>'+(i===p.et?"Mover…":e.n)+'</option>';}).join("")+'</select>'; }

/* A: quadro */
function corpoA(){
  var l=vis();
  var cols=ETAPAS.map(function(e,i){
    var c=l.filter(function(p){return p.et===i;}), at=c.filter(atras).length;
    var cards=c.map(function(p){
      var cor=FORN[p.f]||"#3a3a40";
      return '<div class="card"><div class="fx" style="background:'+cor+'"><span>'+esc(p.f)+'</span><i class="'+(atras(p)?"at":"")+'">'+p.dias+' d</i></div><div class="ct">'
       +'<div class="l"><span>'+(p.rom?"Romaneio "+p.rom:"Sem romaneio")+'</span><span>'+p.pc+' peças</span></div>'
       +'<div class="l"><span class="val">'+brl(pagar(p))+'</span><span>Desc. '+p.d+'%</span></div>'
       +'<div class="l">'+bchip(p.banho)+'<span class="chip c-n">CNPJ '+p.cnpj+'</span></div>'
       +'<div class="l" title="Nota '+brl(nota(p))+' · Pix '+brl(pix(p))+'"><span>Nota '+p.nota+'%</span><span>Pix '+(100-p.nota)+'%</span></div>'
       +'<div class="ac">'+botao(p)+selMover(p)+'</div></div></div>'; }).join("");
    return '<div class="col'+(i===4?" fim":"")+'"><div class="ch"><b>'+e.n+'</b><small>'+c.length+(c.length===1?' pedido':' pedidos')+' · '+e.txt+(at?' · <span class="v-ruim">'+at+' atrasados</span>':'')+'</small></div>'+(cards||'<div class="vazio">Nenhum pedido.</div>')+'</div>'; }).join("");
  return totais()+'@@F@@<div class="kan">'+cols+'</div>';
}
/* B: planilha */
function passos(p){ var h=""; for(var i=0;i<5;i++){ h+='<i class="'+(i<p.et?"f":(i===p.et?(p.et===4?"c":(atras(p)?"a":"f")):""))+'"></i>'; } return '<span class="passos">'+h+'<span>'+ETAPAS[p.et].n+'</span></span>'; }
function corpoB(){
  var l=vis(), t={pc:0,li:0,pg:0,no:0,px:0};
  var lin=l.map(function(p){ t.pc+=p.pc; t.li+=p.lista; t.pg+=pagar(p); t.no+=nota(p); t.px+=pix(p);
    return '<tr class="'+(atras(p)?"at":"")+'"><td>'+tag(p.f)+'</td><td>'+(p.rom||"—")+'</td><td>'+passos(p)+'</td><td class="n">'+p.dias+'</td><td class="n">'+p.pc+'</td><td class="n">'+brl(p.lista)+'</td><td class="n">'+p.d+'%</td><td class="n">'+brl(pagar(p))+'</td><td class="n">'+brl(nota(p))+'</td><td class="n">'+brl(pix(p))+'</td><td>'+bchip(p.banho)+'</td><td>'+p.cnpj+'</td><td>'+(p.et===4?"":'<button class="pri" onclick="avancar('+p.id+')">'+(p.et===1?"Romaneio ›":"Concluir ›")+'</button>')+'</td></tr>'; }).join("");
  var tab='<div class="bloco"><div class="tt">Pedidos · '+l.length+'</div><div class="rolar"><table><thead><tr><th>Fornecedor</th><th>Romaneio</th><th>Etapa</th><th class="n">Dias</th><th class="n">Peças</th><th class="n">Lista</th><th class="n">Desc.</th><th class="n">A pagar</th><th class="n">Nota</th><th class="n">Pix</th><th>Banho</th><th>CNPJ</th><th></th></tr></thead><tbody>'+lin
   +'<tr class="tot"><td colspan="4">Total</td><td class="n">'+t.pc+'</td><td class="n">'+brl(t.li)+'</td><td class="n">'+(t.li?Math.round((1-t.pg/t.li)*100):0)+'%</td><td class="n">'+brl(t.pg)+'</td><td class="n">'+brl(t.no)+'</td><td class="n">'+brl(t.px)+'</td><td colspan="3"></td></tr></tbody></table></div></div>';
  return totais()+'@@F@@'+tab;
}


var MODO="q", FILTRO=null;
function segmAB(){ return '<div class="seg" id="seg"><span data-m="q" class="'+(MODO==="q"?"on":"")+'" style="cursor:pointer">Quadro</span><span data-m="p" class="'+(MODO==="p"?"on":"")+'" style="cursor:pointer">Planilha</span></div>'; }
function montar(){ document.getElementById("T").innerHTML=topo(segmAB())+'<div class="miolo" style="display:flex;flex-direction:column;gap:10px"></div></div>';
  document.querySelectorAll("#seg span").forEach(function(b){ b.onclick=function(){ MODO=this.getAttribute("data-m"); document.querySelectorAll("#seg span").forEach(function(x){ x.className = x.getAttribute("data-m")===MODO ? "on" : ""; }); desenhar(); }; }); }
function ligar(n){
  n.querySelector(".fq").oninput=function(){ F.q=this.value; desenhar(); }; n.querySelector(".ff").onchange=function(){ F.forn=this.value; desenhar(); };
  n.querySelector(".fb").onchange=function(){ F.banho=this.value; desenhar(); }; n.querySelector(".fc").onchange=function(){ F.cnpj=this.value; desenhar(); };
  n.querySelector(".fs").onchange=function(){ F.sit=this.value; desenhar(); };
  n.querySelector(".fl").onclick=function(){ F={q:"",forn:"",banho:"",cnpj:"",sit:""}; n.querySelector(".fq").value=""; n.querySelector(".ff").value=""; n.querySelector(".fb").value=""; n.querySelector(".fc").value=""; n.querySelector(".fs").value=""; desenhar(); };
}
function desenhar(){
  var el=document.querySelector("#T .miolo"); if(!FILTRO){ var d=document.createElement("div"); d.innerHTML=filtros(); FILTRO=d.firstChild; ligar(FILTRO); }
  var foco=document.activeElement===FILTRO.querySelector(".fq"), pos=foco?FILTRO.querySelector(".fq").selectionStart:0;
  el.innerHTML=(MODO==="q"?corpoA():corpoB()).replace("@@F@@","<div id=\"slotf\"></div>");
  var slot=document.getElementById("slotf"); slot.parentNode.replaceChild(FILTRO,slot);
  if(foco){ var q=FILTRO.querySelector(".fq"); q.focus(); q.setSelectionRange(pos,pos); }
}
montar(); desenhar();
</script>
