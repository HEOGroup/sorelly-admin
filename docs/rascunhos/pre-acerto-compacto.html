<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-acerto · compacto</title>
<style>
  :root{ --fundo:#0B0B0C; --cartao:#FFFFFF; --texto:#1F1A10; --linha:#E4E0D6; --ouro:#C9A13B; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--fundo);color:#fff;font:13px/1.3 Inter,system-ui,sans-serif;padding:20px 16px 48px}
  h1{font-size:20px;font-weight:700;text-align:center}
  .sub{text-align:center;margin:4px auto 16px;max-width:560px}
  .tel{width:100%;max-width:340px;margin:0 auto}
  .cart{background:var(--cartao);color:var(--texto);border-radius:18px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  button,select,input{font:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .topo{display:flex;align-items:center;justify-content:space-between;min-height:32px}
  .topo b{font-size:13px}
  .quem{padding:2px 0 8px;border-bottom:1px solid var(--linha)}
  .quem b{display:block;font-weight:600}
  .quem span{font-size:11px}
  .info{width:32px;height:32px;border-radius:50%;border:1px solid var(--linha);background:#fff;font-weight:700;font-style:italic;font-family:Georgia,serif;font-size:15px;cursor:pointer}
  .info.on{background:var(--texto);color:#fff;border-color:var(--texto)}
  .sec{display:flex;align-items:center;justify-content:space-between;min-height:32px;padding-top:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .l{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:36px;border-bottom:1px solid var(--linha)}
  .l .n{font-weight:600}
  .l small{font-size:11px}
  .dir{display:flex;align-items:center;gap:2px}
  .x{width:28px;height:32px;border:0;background:transparent;font-size:18px;cursor:pointer}
  .btn{height:32px;border:1px solid var(--linha);border-radius:8px;background:#fff;padding:0 12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn.mini{width:32px;padding:0}
  .btn.cheio{background:var(--texto);color:#fff;border-color:var(--texto);width:100%;margin-top:10px}
  .btn.peq{height:28px;padding:0 10px}
  .campo{height:32px;border:1px solid var(--linha);border-radius:8px;background:#fff;padding:0 8px;width:100%}
  .seg{display:flex;border:1px solid var(--linha);border-radius:8px;overflow:hidden}
  .seg button{flex:1;height:32px;border:0;border-right:1px solid var(--linha);background:#fff;cursor:pointer}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--texto);color:#fff;font-weight:600}
  .form{padding:6px 0;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:6px}
  .res{margin-top:8px;border-top:2px solid var(--ouro)}
  .res .r{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;align-items:center;min-height:30px;border-bottom:1px solid var(--linha);text-align:right}
  .res .r>:first-child{text-align:left;font-weight:600}
  .res .cab{font-size:11px;font-weight:700;text-transform:uppercase;min-height:28px}
  .res .fin{font-size:15px}
  .travado{padding:6px 0;font-weight:600;text-align:center}
  .regras{margin:4px 0;border-bottom:1px solid var(--linha)}
  .regras .r{display:flex;justify-content:space-between;min-height:26px;align-items:center;border-top:1px solid var(--linha)}
  .regras .r.cab{font-size:11px;font-weight:700;text-transform:uppercase;border-top:0;margin-top:6px}
  .regras p{padding:4px 0}
</style>
</head>
<body>
<h1>Pré-acerto · compacto</h1>
<p class="sub">Versão 1 mais compacta: uma linha por item e um resumo em tabela que separa <b>Remarcação</b>, <b>Atraso</b> e <b>Final</b>. Sem degradê. Tudo funciona.</p>
<div class="tel"><div class="cart" id="P"></div></div>

<script>
var BASE = 45, ESCADA = [[5,15],[8,50],[15,100]], MOTIVOS = ["Falecimento na família","Doença","Problema pessoal","Outro"];
var ATR = [[7,5,5],[15,10,10],[30,15,15],[45,20,20],[59,25,25]];
var S = {info:false, salvo:false, lista:[{t:"multa"}], abre:false, novo:"multa", motivo:MOTIVOS[0], atraso:5};
var n = function(){ return S.lista.filter(function(x){ return x.t==="multa"; }).length; };
var rem = function(k){ var e = k>0 ? ESCADA[Math.min(k,3)-1] : [0,0]; return {c:e[0], b:e[1]}; };
var atr = function(d){ if(d<=0) return {c:0,b:0,tudo:false}; if(d>=60) return {c:BASE,b:100,tudo:true}; var x = ATR.find(function(y){ return d<=y[0]; }); return {c:x[1],b:x[2],tudo:false}; };
var cb = function(c,b){ return '<span class="num">Comissão −'+c+'% · Brinde −'+b+'%</span>'; };

function regras(){ return '<div class="regras"><div class="r cab"><span>Remarcação com multa</span><span>Comissão · Brinde</span></div><div class="r"><span>1ª remarcação</span><span class="num">−5% · −15%</span></div><div class="r"><span>2ª remarcação</span><span class="num">−8% · −50%</span></div><div class="r"><span>3ª ou mais</span><span class="num">−15% · −100%</span></div><p>A remarcação isenta, com motivo, não pesa.</p><div class="r cab"><span>Atraso do acerto</span><span>Comissão · Brinde</span></div><div class="r"><span>Até 7 dias</span><span class="num">−5% · −5%</span></div><div class="r"><span>Até 15 dias</span><span class="num">−10% · −10%</span></div><div class="r"><span>Até 30 dias</span><span class="num">−15% · −15%</span></div><div class="r"><span>Até 45 dias</span><span class="num">−20% · −20%</span></div><div class="r"><span>Até 59 dias</span><span class="num">−25% · −25%</span></div><div class="r"><span>60 dias ou mais</span><span class="num">perde tudo</span></div></div>'; }

function desenha(){
  var k = 0, r = rem(n()), a = atr(S.atraso);
  var itens = S.lista.map(function(x,i){ if(x.t==="multa") k++; var e = rem(k), multa = x.t==="multa";
    return '<div class="l"><div><span class="n">'+(i+1)+'ª · '+(multa?'Com multa':'Isenta')+'</span>'+(multa?'':'<br><small>'+x.m+'</small>')+'</div><div class="dir">'+(multa?cb(e.c,e.b):'<span class="num">não pesa</span>')+(S.salvo?'':'<button class="x" data-del="'+i+'" aria-label="Tirar">×</button>')+'</div></div>'; }).join('') || '<div class="l"><span class="n">Nenhuma remarcação</span></div>';
  var form = S.abre && !S.salvo ? '<div class="form"><div class="seg"><button data-tipo="multa" class="'+(S.novo==="multa"?'on':'')+'">Com multa</button><button data-tipo="isenta" class="'+(S.novo==="isenta"?'on':'')+'">Isenta</button></div>'+(S.novo==="isenta"?'<select class="campo" data-motivo aria-label="Motivo da isenção">'+MOTIVOS.map(function(m){ return '<option'+(m===S.motivo?' selected':'')+'>'+m+'</option>'; }).join('')+'</select>':'')+'<button class="btn" data-add>Adicionar</button></div>' : '';
  var sec1 = '<div class="sec"><span>Remarcações</span>'+(S.salvo?'':'<button class="btn peq" data-abre>+ Remarcação</button>')+'</div>';
  var ctl = S.salvo ? '<span class="num">'+S.atraso+' dias</span>' : '<span class="dir"><button class="btn mini" data-atr="-1">−</button><span class="num" style="min-width:58px;text-align:center">'+S.atraso+' dias</span><button class="btn mini" data-atr="1">+</button></span>';
  var efA = S.atraso<=0 ? '<span class="num">no prazo</span>' : (a.tudo ? '<span class="num">perde tudo</span>' : cb(a.c,a.b));
  var sec2 = '<div class="sec"><span>Atraso do acerto</span></div><div class="l"><span class="n">Dias depois de 03/11</span>'+ctl+'</div><div class="l" style="min-height:30px"><small>Perda pelo atraso</small>'+efA+'</div>';
  var cF = a.tudo ? 0 : Math.max(0, BASE-r.c-a.c), bF = a.tudo ? 100 : Math.min(100, r.b+a.b);
  var res = '<div class="res"><div class="r cab"><span></span><span>Remarcação</span><span>Atraso</span><span>Final</span></div>'
    +'<div class="r"><span>Comissão</span><span class="num">−'+r.c+'%</span><span class="num">'+(a.tudo?'tudo':'−'+a.c+'%')+'</span><span class="num fin">'+cF+'%</span></div>'
    +'<div class="r"><span>Brinde</span><span class="num">−'+r.b+'%</span><span class="num">'+(a.tudo?'tudo':'−'+a.b+'%')+'</span><span class="num fin">−'+bF+'%</span></div></div>'
    +'<small style="display:block;padding-top:4px">Comissão base '+BASE+'%. Final = base menos as duas perdas.</small>'+(a.tudo?'<div class="travado">60 dias ou mais: perde tudo (jurídico)</div>':'');
  var salvar = S.salvo ? '<div class="travado">Salvo. No acerto fica travado.</div><button class="btn cheio" data-edita>Editar pré-acerto</button>' : '<button class="btn cheio" data-salva>Salvar pré-acerto</button>';
  document.getElementById("P").innerHTML = '<div class="topo"><b>Pré-acerto</b><button class="info'+(S.info?' on':'')+'" data-info aria-label="Regras">i</button></div><div class="quem"><b>Francelle Schmidt Alves Pinto dos Santos</b><span>Acerto previsto para 03/11/2026</span></div>'+(S.info?regras():'')+sec1+itens+form+sec2+res+salvar; }
document.addEventListener("change", function(ev){ if(ev.target.hasAttribute("data-motivo")){ S.motivo = ev.target.value; desenha(); } });
document.addEventListener("click", function(ev){ var b = ev.target.closest("button"); if(!b) return; var d = b.dataset;
  if("info" in d) S.info = !S.info;
  else if("salva" in d) S.salvo = true;
  else if("edita" in d) S.salvo = false;
  else if("abre" in d) S.abre = !S.abre;
  else if(d.tipo) S.novo = d.tipo;
  else if("add" in d){ S.lista.push(S.novo==="multa" ? {t:"multa"} : {t:"isenta", m:S.motivo}); S.abre = false; }
  else if(d.del) S.lista.splice(+d.del,1);
  else if(d.atr) S.atraso = Math.max(0, Math.min(60, S.atraso + (+d.atr)));
  else return; desenha(); });
desenha();
</script>
</body>
</html>
