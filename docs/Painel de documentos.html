*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Segoe UI,system-ui,sans-serif}

nav button small{color:var(--mut);margin-left:4px}
main{padding:16px 20px 40px;max-width:900px}
a.it{display:flex;gap:10px;align-items:baseline;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:0 0 8px;color:var(--tx);text-decoration:none}
a.it:hover{border-color:var(--ac)}a.it .t{font-weight:500}a.it .p{color:var(--mut);font-size:12px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--acbg);color:var(--tx);border-radius:6px;padding:2px 8px;white-space:nowrap}
.l{font-size:11px;color:var(--mut);margin-left:6px}
.vazio{color:var(--mut);padding:12px 0}
</style></head><body>
