<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regras</title>
<style>
:root{--bg:#0F0D09;--card:#1A1610;--borda:#3A3020;--ouro:#E8B84B;--ouro2:#B8862B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:13px/1.4 Inter,system-ui,sans-serif;text-align:center;padding:16px}
.bloco{max-width:900px;margin:0 auto;border:1px solid var(--borda);background:var(--card);border-radius:12px;overflow:hidden}
.bloco>h1{margin:0;padding:8px;font-size:13px;color:#1B1409;background:linear-gradient(90deg,var(--ouro2),var(--ouro),#F1E4C6)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:12px}
.cart{border:1px solid var(--borda);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.cart img{display:block;width:100%;max-width:300px;height:auto;border-radius:6px;border:1px solid var(--borda)}
.bar{display:flex;gap:8px;justify-content:center}
button,a.bt{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--borda);background:#241E14;color:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button:hover,a.bt:hover{background:#33291A}
.pri{background:var(--ouro);color:#1B1409;border-color:var(--ouro)}
.pri:hover{background:#F1C766}
</style>
</head>
