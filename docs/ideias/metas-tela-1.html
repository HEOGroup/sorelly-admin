<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metas: tela 1, Revendedoras</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--s1:#141416;--s2:#1b1b1e;--bd:#2a2a2e;--tx:#f4f4f5;--ouro:#d4a84b;--ok:#4ade80;--no:#f87171;--am:#facc15;--topo:linear-gradient(90deg,#9A6F1E,#E8B84B 48%,#F5E7BE)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:16px;max-width:1320px;margin:0 auto}
.menu{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:12px;flex-wrap:wrap}
.menu span{height:32px;line-height:32px;padding:0 14px;border-bottom:2px solid transparent}
.menu span.on{border-bottom-color:var(--ouro);color:var(--ouro);font-weight:600}
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cab h1{font-size:18px;font-weight:600}
.cab .d{display:flex;gap:8px;align-items:center}
select,input{height:32px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:inherit;padding:0 10px}
.btn{height:32px;min-width:96px;padding:0 14px;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;font:inherit;cursor:pointer}
.btn.p{background:var(--ouro);color:#111;border-color:var(--ouro);font-weight:600}
.blocos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px;align-items:stretch}
.bloco{border:1px solid var(--bd);border-radius:8px;background:var(--s1);display:flex;flex-direction:column}
.bloco>h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--bd);text-align:center}
.lin{display:grid;grid-template-columns:1.5fr 1fr 1fr;align-items:center;height:32px;padding:0 12px;border-bottom:1px solid var(--bd);text-align:center}
.lin:last-child{border-bottom:0}
.lin.h{height:26px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;background:var(--s2)}
.lin.t{background:var(--s2);font-weight:600}
.lin b{font-weight:600}
.bar{display:block;height:8px;background:var(--s2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ouro)}
.l1{display:grid;grid-template-columns:1.3fr 1.5fr 56px;gap:10px;align-items:center;height:32px;padding:0 12px;border-bottom:1px solid var(--bd);text-align:center}
.l1:last-child{border-bottom:0}
.ok{color:var(--ok)}.no{color:var(--no)}.am{color:var(--am)}.ou{color:var(--ouro)}
.rolar{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--s1)}
table{width:100%;border-collapse:collapse;white-space:nowrap;background:var(--topo) top left/100% 30px no-repeat}
thead th{height:30px;padding:0 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:center;color:#1a1306;background:transparent}
thead th button{all:unset;cursor:pointer;margin-left:6px;font-size:11px;padding:2px 4px;border-radius:4px}
thead th button:hover{background:rgba(26,19,6,.18)}
thead th button.f{background:#1a1306;color:#F5E7BE}
td{height:32px;padding:0 12px;text-align:center;border-bottom:1px solid var(--bd)}
tbody tr:hover td{background:rgba(232,184,75,.10)}
tfoot td{font-weight:600;background:var(--s2);border-bottom:0}
.tag{display:inline-block;height:20px;line-height:18px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;font-size:11px}
.tag.ok{border-color:var(--ok)}.tag.no{border-color:var(--no)}.tag.am{border-color:var(--am)}
.pop{position:fixed;z-index:20;width:290px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.6);text-align:left}
.pop .it{height:32px;display:flex;align-items:center;padding:0 8px;border-radius:6px;cursor:pointer}
.pop .it:hover{background:rgba(232,184,75,.12)}
.pop h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px 2px}
.pop input[type=text],.pop input:not([type]){width:100%;margin:4px 0}
.pop .vals{max-height:190px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin:4px 0}
.pop .vals label{display:flex;gap:8px;align-items:center;height:32px;padding:0 8px;cursor:pointer}
.pop .vals label span:last-child{margin-left:auto}
.pop input[type=checkbox]{width:14px;height:14px;padding:0}
.pop .lk{display:flex;gap:12px;padding:2px 8px;font-size:12px}
.pop .lk a{color:var(--ouro);cursor:pointer;text-decoration:underline}
.pop .bt{display:flex;gap:8px;margin-top:6px}
.pop .bt button{flex:1}
@media(max-width:900px){.blocos{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="menu"><span>Campanha</span><span>Simulador</span><span class="on">Revendedoras</span><span>Acompanhamento</span><span>Brindes</span><span>Histórico</span><span>Regras</span></div>
<div class="cab"><h1>Revendedoras</h1><div class="d"><button class="btn" id="limpa" style="display:none">Limpar filtros</button><select><option>Novembro de 2026</option><option>Dezembro de 2026</option></select><button class="btn">Exportar</button></div></div>
<div class="blocos" id="blocos"></div>
<div id="tab"></div>

<script>
const R = v => "R$ " + Number(v).toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const N = v => Number(v).toLocaleString("pt-BR");
const $ = (s, r = document) => r.querySelector(s);
const teto = (x, p) => Math.ceil(x * p / 10000) * 100;
const pct = (a, b) => (b ? (Math.round(a / b * 1000) / 10).toLocaleString("pt-BR") : "0") + "%";

const CL = [
  {id: "ini", nome: "Inicial", de: 0, ate: 999.99, n: 1132, m1: 1500, m2: 2000, ac: .40, p1: .12, p2: .06},
  {id: "a", nome: "R$ 1.000 a 1.499", de: 1000, ate: 1499.99, n: 460, m1: 1700, m2: 2100, ac: .44, p1: .10, p2: .04},
  {id: "b", nome: "R$ 1.500 a 1.999", de: 1500, ate: 1999.99, n: 270, m1: 2300, m2: 2700, ac: .46, p1: .09, p2: .04},
  {id: "c", nome: "R$ 2.000 a 2.499", de: 2000, ate: 2499.99, n: 110, ac: .45, p1: .08, p2: .03},
  {id: "d", nome: "R$ 2.500 a 2.999", de: 2500, ate: 2999.99, n: 71, ac: .45, p1: .08, p2: .03},
  {id: "e", nome: "R$ 3.000 a 3.999", de: 3000, ate: 3999.99, n: 32, ac: .44, p1: .07, p2: .03},
  {id: "f", nome: "R$ 4.000 a 4.999", de: 4000, ate: 4999.99, n: 21, ac: .43, p1: .07, p2: .02},
  {id: "g", nome: "R$ 5.000 a 6.999", de: 5000, ate: 6999.99, n: 14, ac: .43, p1: .07, p2: .02},
  {id: "h", nome: "R$ 7.000 ou mais", de: 7000, ate: 1e9, n: 4, ac: .50, p1: .05, p2: .02, individual: true}
];
const extra = m => { const k = (m - 1500) / 500; return {n: Math.round(96 + 26 * k), b: Math.round(128 + 40 * k)}; };
CL.forEach(c => {
  if (!c.m1 && !c.individual) { c.m1 = teto(c.ate, 115); c.m2 = teto(c.ate, 135); }
  c.acertaram = Math.round(c.n * c.ac); c.b2 = Math.round(c.acertaram * c.p2); c.b1 = Math.round(c.acertaram * c.p1);
  c.nao = c.acertaram - c.b1 - c.b2; c.agu = c.n - c.acertaram;
  const m1 = c.m1 || 9100, m2 = c.m2 || 10700;
  c.custo = c.b1 * (extra(m1).n + extra(m1).b) + c.b2 * (extra(m2).n + extra(m2).b);
});
const T = CL.reduce((s, c) => { ["n", "acertaram", "b1", "b2", "nao", "agu", "custo"].forEach(k => s[k] = (s[k] || 0) + c[k]); return s; }, {});
const metasDe = media => { const c = CL.find(x => media >= x.de && media <= x.ate) || CL[0]; return c.individual ? {c, m1: teto(media, 115), m2: teto(media, 135)} : {c, m1: c.m1, m2: c.m2}; };

$("#blocos").innerHTML = `
<div class="bloco"><h2>Revendedoras por categoria</h2>${CL.map(c => `<div class="l1"><span>${c.nome}</span><span class="bar"><i style="width:${Math.max(2, c.n / CL[0].n * 100)}%"></i></span><b>${N(c.n)}</b></div>`).join("")}</div>
<div class="bloco"><h2>Acertos de novembro</h2>
  <div class="lin h"><span>Situação</span><span>Revendedoras</span><span>Do total</span></div>
  <div class="lin"><span>Participantes</span><b>${N(T.n)}</b><span>100%</span></div>
  <div class="lin"><span>Acertaram</span><b class="ok">${N(T.acertaram)}</b><span>${pct(T.acertaram, T.n)}</span></div>
  <div class="lin"><span>Aguardando acerto</span><b class="am">${N(T.agu)}</b><span>${pct(T.agu, T.n)}</span></div>
  <div class="lin"><span>Previstos até 30/11</span><b>${N(Math.round(T.agu * 0.62))}</b><span>${pct(Math.round(T.agu * 0.62), T.agu)}</span></div>
  <div class="lin"><span>Sem previsão</span><b>${N(T.agu - Math.round(T.agu * 0.62))}</b><span>${pct(T.agu - Math.round(T.agu * 0.62), T.agu)}</span></div>
  <div class="lin t"><span>Taxa de acerto</span><b>${pct(T.acertaram, T.n)}</b><span></span></div>
</div>
<div class="bloco"><h2>Meta de novembro</h2>
  <div class="lin h"><span>Resultado</span><span>Revendedoras</span><span>Dos acertos</span></div>
  <div class="lin"><span>Bateram a Meta 2</span><b class="ok">${N(T.b2)}</b><span>${pct(T.b2, T.acertaram)}</span></div>
  <div class="lin"><span>Bateram a Meta 1</span><b class="ok">${N(T.b1)}</b><span>${pct(T.b1, T.acertaram)}</span></div>
  <div class="lin"><span>Total que bateram</span><b class="ok">${N(T.b1 + T.b2)}</b><span>${pct(T.b1 + T.b2, T.acertaram)}</span></div>
  <div class="lin"><span>Não bateram</span><b class="no">${N(T.nao)}</b><span>${pct(T.nao, T.acertaram)}</span></div>
  <div class="lin"><span>Ainda sem acerto</span><b class="am">${N(T.agu)}</b><span>${pct(T.agu, T.n)} do total</span></div>
  <div class="lin t"><span>Extra de brinde a liberar</span><b class="ou">${R(T.custo)}</b><span>BB e Normal</span></div>
</div>`;

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NOMES = ["Ana", "Beatriz", "Camila", "Daniela", "Eliane", "Fernanda", "Gabriela", "Helena", "Isabel", "Joana", "Karina", "Larissa", "Marina", "Natália", "Olívia", "Patrícia", "Raquel", "Sabrina", "Tatiana", "Viviane"];
const SOBRE = ["Souza", "Menezes", "Rocha", "Silva", "Tavares", "Lima", "Nunes", "Vieira", "Campos", "Ferraz", "Borges", "Duarte", "Gomes", "Oliveira", "Almeida", "Pereira de Andrade", "Costa Moreira dos Santos"];
const REPS = ["Carla - Litoral", "Carla - SC", "Joice", "Priscila"];
const MEDIAS = [0, 0, 420, 650, 980, 1250, 1480, 1720, 1900, 2150, 2640, 3400, 4320, 5800, 7900];
const REV = Array.from({length: 40}, (_, i) => {
  const media = MEDIAS[Math.floor(rnd() * MEDIAS.length)], mt = metasDe(media);
  const acertou = rnd() < .42, vendeu = acertou ? Math.round(mt.m1 * (0.7 + rnd() * .7) / 10) * 10 : null;
  const st = !acertou ? "Aguardando acerto" : vendeu >= mt.m2 ? "Bateu Meta 2" : vendeu >= mt.m1 ? "Bateu Meta 1" : "Não bateu";
  const nivel = st === "Bateu Meta 2" ? mt.m2 : st === "Bateu Meta 1" ? mt.m1 : 0, ex = nivel ? extra(nivel) : null;
  return {
    cod: String(1000 + i * 37), nome: NOMES[Math.floor(rnd() * NOMES.length)] + " " + SOBRE[Math.floor(rnd() * SOBRE.length)], rep: REPS[Math.floor(rnd() * REPS.length)], classe: mt.c.nome, media, cond: "C-0" + (4800 + i),
    m1: mt.m1, m2: mt.m2, prev: acertou ? "Acertou" : String(5 + Math.floor(rnd() * 25)).padStart(2, "0") + "/11", vendeu, st, bb: ex ? ex.b : null, no: ex ? ex.n : null
  };
});
const COLS = [
  ["Código", r => ({t: r.cod, n: +r.cod})], ["Nome", r => ({t: r.nome})], ["Representante", r => ({t: r.rep})], ["Classe", r => ({t: r.classe, n: CL.findIndex(c => c.nome === r.classe)})],
  ["Média", r => ({t: r.media ? R(r.media) : "Sem venda", n: r.media})], ["Condicional", r => ({t: r.cond})], ["Meta 1", r => ({t: R(r.m1), n: r.m1})], ["Meta 2", r => ({t: R(r.m2), n: r.m2})],
  ["Acerto previsto", r => ({t: r.prev})], ["Vendeu", r => ({t: r.vendeu == null ? "Aguardando" : R(r.vendeu), n: r.vendeu == null ? -1 : r.vendeu})],
  ["Situação", r => ({t: r.st})], ["Extra BB", r => ({t: r.bb == null ? "-" : R(r.bb), n: r.bb == null ? -1 : r.bb})], ["Extra Normal", r => ({t: r.no == null ? "-" : R(r.no), n: r.no == null ? -1 : r.no})]
];
const corSt = s => s.startsWith("Bateu") ? "ok" : s === "Não bateu" ? "no" : "am";
let fil = {}, ord = null;

function linhas() {
  let l = REV.filter(r => COLS.every((c, j) => !fil[j] || fil[j].has(c[1](r).t)));
  if (ord) { const f = COLS[ord.j][1]; l = l.slice().sort((a, b) => { const x = f(a), y = f(b); const d = x.n != null && y.n != null ? x.n - y.n : x.t.localeCompare(y.t, "pt-BR"); return d * ord.d; }); }
  return l;
}
function pinta() {
  const l = linhas(), temF = Object.keys(fil).length || ord;
  $("#limpa").style.display = temF ? "" : "none";
  $("#tab").innerHTML = `<div class="rolar"><table><thead><tr>${COLS.map((c, j) => `<th>${c[0]}<button data-j="${j}" class="${fil[j] || (ord && ord.j === j) ? "f" : ""}" title="Filtrar e ordenar">▽</button></th>`).join("")}</tr></thead><tbody>
  ${l.map(r => `<tr>${COLS.map((c, j) => { const v = c[1](r).t; return j === 10 ? `<td><span class="tag ${corSt(v)}">${v}</span></td>` : (j === 11 || j === 12) && r.bb != null ? `<td class="ou">${v}</td>` : `<td>${v}</td>`; }).join("")}</tr>`).join("")}
  </tbody><tfoot><tr><td colspan="13">Mostrando ${l.length} de ${N(T.n)} revendedoras (amostra do protótipo)</td></tr></tfoot></table></div>`;
  $("#tab").querySelectorAll("th button").forEach(b => b.onclick = e => { e.stopPropagation(); abre(+b.dataset.j, b); });
}
function fecha() { document.querySelectorAll(".pop").forEach(p => p.remove()); }
function abre(j, btn) {
  fecha();
  const f = COLS[j][1], cont = new Map();
  REV.forEach(r => { const t = f(r).t; cont.set(t, (cont.get(t) || 0) + 1); });
  const vals = [...cont.keys()].sort((a, b) => a.localeCompare(b, "pt-BR", {numeric: true}));
  let sel = new Set(fil[j] || vals), busca = "";
  const p = document.createElement("div"); p.className = "pop"; p.onclick = e => e.stopPropagation();
  const rb = btn.getBoundingClientRect(); p.style.top = Math.min(rb.bottom + 4, innerHeight - 440) + "px"; p.style.left = Math.max(8, Math.min(rb.left - 130, innerWidth - 306)) + "px";
  const lista = () => vals.filter(v => v.toLowerCase().includes(busca.toLowerCase()));
  const pinta2 = () => {
    p.innerHTML = `<div class="it" data-o="1">Classificar A → Z</div><div class="it" data-o="-1">Classificar Z → A</div><h4>Filtrar por valores</h4><input placeholder="Pesquisar" value="${busca}">
    <div class="lk"><a data-a="todos">Selecionar tudo</a><a data-a="nenhum">Limpar</a><span style="margin-left:auto">${vals.length} valores</span></div>
    <div class="vals">${lista().map(v => `<label><input type="checkbox" ${sel.has(v) ? "checked" : ""} data-v="${v.replace(/"/g, "&quot;")}"><span>${v}</span><span>${cont.get(v)}</span></label>`).join("")}</div>
    <div class="bt"><button class="btn" data-a="lc">Limpar coluna</button><button class="btn p" data-a="ok">Fechar</button></div>`;
    p.querySelectorAll(".it").forEach(i => i.onclick = () => { ord = {j, d: +i.dataset.o}; pinta(); fecha(); });
    const inp = p.querySelector("input:not([type=checkbox])"); inp.oninput = () => { busca = inp.value; pinta2(); const n = p.querySelector("input:not([type=checkbox])"); n.focus(); n.setSelectionRange(busca.length, busca.length); };
    p.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.v) : sel.delete(c.dataset.v); aplica(); });
    p.querySelector('[data-a="todos"]').onclick = () => { lista().forEach(v => sel.add(v)); aplica(); pinta2(); };
    p.querySelector('[data-a="nenhum"]').onclick = () => { lista().forEach(v => sel.delete(v)); aplica(); pinta2(); };
    p.querySelector('[data-a="lc"]').onclick = () => { delete fil[j]; if (ord && ord.j === j) ord = null; pinta(); fecha(); };
    p.querySelector('[data-a="ok"]').onclick = fecha;
  };
  const aplica = () => { if (sel.size === vals.length) delete fil[j]; else fil[j] = new Set(sel); pinta(); const b = $(`#tab th button[data-j="${j}"]`); if (b) { /* mantém o popup */ } };
  document.body.appendChild(p); pinta2();
}
$("#limpa").onclick = () => { fil = {}; ord = null; pinta(); };
document.addEventListener("click", fecha);
pinta();
</script>
</body>
</html>
