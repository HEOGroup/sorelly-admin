<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inadimplência · Dívidas (desenho)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --fundo:#111111; --bloco:#161616; --faixa:#1c1d21; --fio:#2a2c31; --campo:#1b1b1b; --texto:#f1f1f1; --ouro:#e2c044;
         --verde:#34d399; --amarelo:#fbbf24; --vermelho:#f87171; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--fundo); color:var(--texto); font-family:Inter,system-ui,sans-serif; font-size:13px; }
  button,input{ font:inherit; color:inherit; }
  .aviso{ background:#2a2410; color:var(--ouro); text-align:center; padding:6px 12px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
  .sistema{ height:40px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--fio); }
  .sistema .voltar{ height:32px; padding:0 10px; border:1px solid var(--fio); border-radius:6px; background:transparent; }
  .sistema .icone{ width:22px; height:22px; border-radius:6px; background:var(--ouro); color:#1a1306; display:grid; place-items:center; font-weight:700; }
  .sistema b{ font-weight:600; }
  .menu{ height:36px; display:flex; align-items:center; gap:4px; padding:0 12px; border-bottom:1px solid var(--fio); overflow-x:auto; white-space:nowrap; }
  .menu span{ height:30px; display:inline-flex; align-items:center; padding:0 10px; border-radius:6px; }
  .menu span.ativa{ color:var(--ouro); background:rgba(226,192,68,.12); font-weight:600; }
  .pagina{ padding:14px 16px 28px; max-width:1640px; margin:0 auto; }
  .cabeca{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  h1{ margin:0; font-size:20px; font-weight:600; }
  .sub{ margin:2px 0 0; }
  .lado{ display:flex; gap:8px; align-items:center; }
  .botao{ height:32px; min-width:96px; padding:0 14px; border-radius:6px; border:1px solid var(--fio); background:transparent; cursor:pointer; white-space:nowrap; }
  .botao.principal{ border-color:var(--ouro); background:rgba(226,192,68,.2); color:var(--ouro); font-weight:600; }
  .bloco{ border:1px solid var(--fio); border-radius:8px; background:var(--bloco); }
  .rola{ overflow-x:auto; min-height:470px; }
  .tabela{ min-width:1556px; }
  /* Layout D: fileira de campos, fio fino, cabeçalho e total em faixa escura, tudo centralizado, nada quebra */
  .fileira{ display:grid; grid-template-columns:124px 210px 136px 124px 112px 112px 112px 130px minmax(240px,1fr) 156px 100px; border-bottom:1px solid var(--fio); }
  .fileira > div{ height:32px; display:flex; align-items:center; justify-content:center; padding:0 8px; white-space:nowrap; border-right:1px solid var(--fio); font-variant-numeric:tabular-nums; }
  .fileira > div:last-child{ border-right:0; }
  .fileira.topo{ background:var(--faixa); }
  .fileira.topo > div{ height:30px; padding:0; position:relative; }
  /* filtro na coluna, igual ao Google Planilhas: o cabeçalho inteiro é o botão */
  .col{ width:100%; height:30px; display:flex; align-items:center; justify-content:center; gap:6px; border:0; background:transparent; cursor:pointer;
        font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; color:#fff; padding:0 6px; white-space:nowrap; }
  .col:hover{ background:rgba(255,255,255,.06); }
  .col .seta{ font-size:9px; }
  .col.ativo{ color:var(--ouro); }
  .menuCol{ position:absolute; top:31px; left:0; z-index:20; width:230px; background:#1b1c20; border:1px solid var(--fio); border-radius:8px; padding:6px; box-shadow:0 12px 28px rgba(0,0,0,.55); text-align:left; }
  .menuCol.direita{ left:auto; right:0; }
  .menuCol button.item, .menuCol label.item{ width:100%; height:30px; display:flex; align-items:center; gap:8px; padding:0 8px; border:0; background:transparent; border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; }
  .menuCol .item:hover{ background:rgba(255,255,255,.07); }
  .menuCol .item.marcado{ color:var(--ouro); }
  .menuCol input[type=text]{ width:100%; height:32px; margin:6px 0; border:1px solid var(--fio); border-radius:6px; background:var(--campo); padding:0 8px; }
  .menuCol .lista{ max-height:190px; overflow-y:auto; }
  .menuCol .linha{ border-top:1px solid var(--fio); margin:6px 0; }
  .menuCol input[type=checkbox]{ width:14px; height:14px; accent-color:var(--ouro); }
  .fileira.total{ background:var(--faixa); font-weight:600; border-bottom:0; }
  .fileira.item{ cursor:pointer; }
  .fileira.item:hover{ background:rgba(255,255,255,.04); }
  .verde{ color:var(--verde); } .amarelo{ color:var(--amarelo); } .vermelho{ color:var(--vermelho); }
  .ponto{ margin-right:6px; font-size:10px; }
  .rodape{ padding:8px 10px; text-align:center; border-top:1px solid var(--fio); }
</style>
</head>
<body>
<div class="aviso">Desenho para aprovação · nomes e valores inventados · nada gravado</div>
<div class="sistema"><button class="voltar">‹ Voltar</button><span class="icone">§</span><b>Inadimplência</b></div>
<div class="menu"><span class="ativa">Dívidas</span><span>Cobrança do dia</span><span>Pagamentos</span><span>Serasa</span><span>Kits em atraso</span><span>Relatórios</span><span>Regras</span></div>

<div class="pagina">
  <div class="cabeca">
    <div><h1>Dívidas</h1><p class="sub">Uma linha por dívida. O saldo muda sozinho quando um pagamento é confirmado. Filtre e ordene clicando no nome da coluna.</p></div>
    <div class="lado"><button class="botao" id="limpar" style="display:none">Limpar filtros</button><button class="botao principal">Nova dívida</button></div>
  </div>
  <div class="bloco">
    <div class="rola"><div class="tabela" id="tabela"></div></div>
    <div class="rodape" id="rodape"></div>
  </div>
</div>

<script>
// Dados INVENTADOS, só para mostrar o desenho.
var D = [
  {data:"2026-11-04", nome:"Marina Souza Albuquerque", rep:"Dayanne",  cobra:"Representante", valor:1481.00, pago:0,      sit:"OK",           acao:"Prazo da representante: faltam 2 dias", nota:"Assinada",     serasa:"—"},
  {data:"2026-11-03", nome:"Jéssica Ramos de Lima",    rep:"Thalita",  cobra:"Setor",         valor:894.40,  pago:388.00, sit:"OK",           acao:"Parcela 2 de 3 · 20/11/2026",           nota:"Assinada",     serasa:"—"},
  {data:"2026-10-28", nome:"Carla Regina Monteiro",    rep:"Sorelly",  cobra:"Setor",         valor:537.60,  pago:300.00, sit:"Verificar",    acao:"Parcela vencida há 12 dias",            nota:"Assinada",     serasa:"—"},
  {data:"2026-10-27", nome:"Patrícia Nunes Ferraz",    rep:"Fábila",   cobra:"Setor",         valor:494.20,  pago:300.00, sit:"Verificar",    acao:"Parcela vencida há 18 dias",            nota:"Assinada",     serasa:"—"},
  {data:"2026-10-21", nome:"Tatiane Borges Cardoso",   rep:"Vanessa",  cobra:"Setor",         valor:2140.00, pago:0,      sit:"Não responde", acao:"3º contato · 12/11/2026",               nota:"Assinada",     serasa:"—"},
  {data:"2026-10-09", nome:"Rosângela Pires Matos",    rep:"Mayara",   cobra:"Setor",         valor:1320.50, pago:0,      sit:"Não responde", acao:"Analisar Serasa · 33 dias em aberto",   nota:"Não assinada", serasa:"—"},
  {data:"2026-10-30", nome:"Aline Cristina Teodoro",   rep:"Lysie",    cobra:"Representante", valor:277.10,  pago:0,      sit:"Próximo mês",  acao:"Parcela 1 de 2 · 05/12/2026",           nota:"Assinada",     serasa:"—"},
  {data:"2026-10-15", nome:"Fernanda Lopes Vieira",    rep:"Veridiana",cobra:"Setor",         valor:1002.00, pago:501.00, sit:"OK",           acao:"Parcela 2 de 2 · 15/11/2026",           nota:"Assinada",     serasa:"—"},
  {data:"2026-09-12", nome:"Simone Aparecida Rocha",   rep:"Jessica",  cobra:"Setor",         valor:4593.00, pago:0,      sit:"Negativada",   acao:"Avaliar Jurídico",                      nota:"Assinada",     serasa:"14/10/2026"},
  {data:"2026-09-02", nome:"Débora Martins Salgado",   rep:"Anne",     cobra:"Setor",         valor:615.40,  pago:200.00, sit:"Negativada",   acao:"Parcela 2 de 3 · 18/11/2026",           nota:"Assinada",     serasa:"06/10/2026"},
  {data:"2026-11-01", nome:"Luciana Prado Bastos",     rep:"Dayanne",  cobra:"Representante", valor:300.00,  pago:300.00, sit:"Quitada",      acao:"Baixar na DevMaster",                   nota:"Assinada",     serasa:"—"},
  {data:"2026-10-20", nome:"Beatriz Nogueira Sampaio", rep:"Sorelly",  cobra:"Setor",         valor:657.80,  pago:657.80, sit:"Quitada",      acao:"—",                                     nota:"Assinada",     serasa:"—"}
];
var COR = {"OK":"verde", "Quitada":"verde", "Verificar":"vermelho", "Negativada":"vermelho", "Não responde":"amarelo", "Próximo mês":"amarelo"};
function brl(n){ return "R$ " + n.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function dia(iso){ return iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4); }
// cada coluna: t = título, txt = o que aparece (e o que o filtro lista), ord = valor para ordenar
var COLS = [
  {k:"data",  t:"Data da dívida",   txt:function(d){ return dia(d.data); }, ord:function(d){ return d.data; }},
  {k:"nome",  t:"Devedora",         txt:function(d){ return d.nome; }},
  {k:"rep",   t:"Representante",    txt:function(d){ return d.rep; }},
  {k:"cobra", t:"Quem cobra",       txt:function(d){ return d.cobra; }},
  {k:"valor", t:"Valor",            txt:function(d){ return brl(d.valor); }, ord:function(d){ return d.valor; }},
  {k:"pago",  t:"Pago",             txt:function(d){ return brl(d.pago); }, ord:function(d){ return d.pago; }, cor:function(d){ return d.pago>0 ? "verde" : ""; }},
  {k:"falta", t:"Falta",            txt:function(d){ return brl(d.valor-d.pago); }, ord:function(d){ return d.valor-d.pago; }, cor:function(d){ return d.valor-d.pago>0.005 ? "vermelho" : "verde"; }},
  {k:"sit",   t:"Situação",         txt:function(d){ return d.sit; }, cor:function(d){ return COR[d.sit]; }, ponto:true},
  {k:"acao",  t:"Próxima ação",     txt:function(d){ return d.acao; }},
  {k:"nota",  t:"Nota promissória", txt:function(d){ return d.nota; }, cor:function(d){ return d.nota==="Assinada" ? "" : "vermelho"; }},
  {k:"serasa",t:"Serasa",           txt:function(d){ return d.serasa; }}
];
var filtros = {}, ordem = null, aberto = null, busca = "";   // filtros[k] = lista dos valores MARCADOS (sem a chave = todos)
function valores(c){ var o = {}; D.forEach(function(d){ o[c.txt(d)] = 1; }); return Object.keys(o).sort(function(a,b){ return a.localeCompare(b,"pt-BR",{numeric:true}); }); }
function linhas(){
  var L = D.filter(function(d){ return COLS.every(function(c){ return !filtros[c.k] || filtros[c.k].indexOf(c.txt(d))>=0; }); });
  if(ordem){ var c = COLS.find(function(x){ return x.k===ordem.k; }), f = c.ord || c.txt;
    L = L.slice().sort(function(a,b){ var x = f(a), y = f(b); return (typeof x==="number" ? x-y : String(x).localeCompare(String(y),"pt-BR"))*ordem.dir; }); }
  return L;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function menu(c, i){
  var todos = valores(c), marc = filtros[c.k] || todos, vis = todos.filter(function(v){ return !busca || v.toLowerCase().indexOf(busca.toLowerCase())>=0; });
  var h = "<div class='menuCol"+(i>=COLS.length-3 ? " direita" : "")+"' data-menu='1'>";
  h += "<button class='item"+(ordem && ordem.k===c.k && ordem.dir===1 ? " marcado" : "")+"' data-ord='1'>Ordenar de A a Z</button>";
  h += "<button class='item"+(ordem && ordem.k===c.k && ordem.dir===-1 ? " marcado" : "")+"' data-ord='-1'>Ordenar de Z a A</button>";
  h += "<div class='linha'></div><input type='text' id='buscaCol' placeholder='Buscar nesta coluna' value=\""+esc(busca)+"\">";
  h += "<label class='item'><input type='checkbox' data-todos='1'"+(vis.length && vis.every(function(v){ return marc.indexOf(v)>=0; }) ? " checked" : "")+">Selecionar tudo</label><div class='lista'>";
  vis.forEach(function(v){ h += "<label class='item'><input type='checkbox' data-v=\""+esc(v)+"\""+(marc.indexOf(v)>=0 ? " checked" : "")+">"+esc(v)+"</label>"; });
  h += "</div>"+(filtros[c.k] ? "<div class='linha'></div><button class='item' data-limpa='1'>Limpar o filtro desta coluna</button>" : "")+"</div>";
  return h;
}
function desenha(){
  var L = linhas(), h = "<div class='fileira topo'>";
  COLS.forEach(function(c, i){ var ativo = filtros[c.k] || (ordem && ordem.k===c.k);
    h += "<div><button class='col"+(ativo ? " ativo" : "")+"' data-col='"+c.k+"'>"+c.t+"<span class='seta'>"+(ordem && ordem.k===c.k ? (ordem.dir===1 ? "▲" : "▼") : (filtros[c.k] ? "◆" : "▾"))+"</span></button>"+(aberto===c.k ? menu(c, i) : "")+"</div>"; });
  h += "</div>";
  var tv = 0, tp = 0;
  L.forEach(function(d){ tv += d.valor; tp += d.pago;
    h += "<div class='fileira item' title='Abre a ficha da devedora'>"+COLS.map(function(c){ return "<div class='"+(c.cor ? c.cor(d) : "")+"'>"+(c.ponto ? "<span class='ponto'>●</span>" : "")+esc(c.txt(d))+"</div>"; }).join("")+"</div>"; });
  h += "<div class='fileira total'><div>Total</div><div>"+L.length+" de "+D.length+" dívidas</div><div></div><div></div><div>"+brl(tv)+"</div><div class='verde'>"+brl(tp)+"</div><div class='vermelho'>"+brl(tv-tp)+"</div><div></div><div></div><div></div><div></div></div>";
  document.getElementById("tabela").innerHTML = h;
  document.getElementById("limpar").style.display = (Object.keys(filtros).length || ordem) ? "" : "none";
  document.getElementById("rodape").textContent = L.length ? "Clique em uma linha para abrir a ficha da devedora: histórico, acordo, contatos e pagamentos." : "Nenhuma dívida com estes filtros.";
  var b = document.getElementById("buscaCol"); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
}
document.getElementById("tabela").addEventListener("click", function(ev){
  var t = ev.target, col = t.closest("[data-col]");
  if(col){ aberto = aberto===col.dataset.col ? null : col.dataset.col; busca = ""; desenha(); return; }
  if(!aberto) return; var c = COLS.find(function(x){ return x.k===aberto; });
  if(t.dataset.ord){ ordem = {k:c.k, dir:+t.dataset.ord}; aberto = null; desenha(); return; }
  if(t.dataset.limpa){ delete filtros[c.k]; aberto = null; desenha(); return; }
  if(t.dataset.todos || t.dataset.v!==undefined){ var todos = valores(c), marc = (filtros[c.k] || todos).slice();
    if(t.dataset.todos){ var vis = todos.filter(function(v){ return !busca || v.toLowerCase().indexOf(busca.toLowerCase())>=0; }); marc = t.checked ? marc.concat(vis.filter(function(v){ return marc.indexOf(v)<0; })) : marc.filter(function(v){ return vis.indexOf(v)<0; }); }
    else { var v = t.dataset.v; marc = t.checked ? marc.concat([v]) : marc.filter(function(x){ return x!==v; }); }
    if(marc.length===todos.length) delete filtros[c.k]; else filtros[c.k] = marc; desenha(); }
});
document.getElementById("tabela").addEventListener("input", function(ev){ if(ev.target.id==="buscaCol"){ busca = ev.target.value; desenha(); } });
document.addEventListener("click", function(ev){ if(aberto && !ev.target.closest("[data-menu]") && !ev.target.closest("[data-col]")){ aberto = null; desenha(); } });
document.getElementById("limpar").addEventListener("click", function(){ filtros = {}; ordem = null; aberto = null; desenha(); });
desenha();
</script>
</body>
</html>
