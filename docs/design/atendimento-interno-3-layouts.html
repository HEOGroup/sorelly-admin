<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atendimento interno · 3 layouts</title>
<style>
:root{--bg:#14110c;--card:#1d1911;--card2:#262016;--line:#3a3222;--ouro:#E8B84B;--ouro2:#B8862B;--tx:#fff;--mut:#bfb59d;--ok:#22C55E;--warn:#F59E0B;--bad:#EF4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 Inter,system-ui,sans-serif}
.top{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.top b{font-size:15px;margin-right:8px}
.tab{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:#fff;cursor:pointer;font:inherit;font-weight:600}
.tab.on{background:linear-gradient(90deg,var(--ouro2),var(--ouro));color:#1B1409;border-color:var(--ouro)}
.wrap{padding:14px 16px;max-width:1180px;margin:auto}
.nota{color:var(--mut);font-size:12px;margin:0 0 10px}
.btn{height:32px;padding:0 14px;border-radius:8px;border:0;background:linear-gradient(90deg,var(--ouro2),var(--ouro));color:#1B1409;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card2);color:#fff;border:1px solid var(--line)}
.btn.big{height:44px;font-size:14px;padding:0 22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:#fff;padding:0 10px;font:inherit;width:100%}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin-bottom:4px;display:block}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bar{padding:8px 12px;background:linear-gradient(90deg,rgba(232,184,75,.28),rgba(232,184,75,.04));font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.pad{padding:12px}
.grid{display:grid;gap:10px}
.opt{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-weight:600;cursor:pointer;padding:0 10px}
.opt.on{background:rgba(232,184,75,.18);border-color:var(--ouro);color:var(--ouro)}
.fila{display:flex;flex-direction:column;gap:6px}
.cli{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.cli.on{border-color:var(--ouro);background:rgba(232,184,75,.12)}
.cli .h{font-weight:700;color:var(--ouro);width:44px;font-variant-numeric:tabular-nums}
.cli .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:700}
.t-ag{background:rgba(56,189,248,.18);color:#38BDF8}.t-ch{background:rgba(245,158,11,.2);color:var(--warn)}.t-at{background:rgba(232,184,75,.2);color:var(--ouro)}.t-ok{background:rgba(34,197,94,.2);color:var(--ok)}
.cond{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.cond.on{border-color:var(--ok);background:rgba(34,197,94,.1)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--mut);display:grid;place-items:center;font-size:13px;flex:none}
.on>.chk,.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.steps{display:flex;gap:4px}
.st{flex:1;height:30px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);padding:0 4px;text-align:center;border:1px solid var(--line)}
.st.on{background:linear-gradient(90deg,var(--ouro2),var(--ouro));color:#1B1409;border-color:var(--ouro)}
.st.ok{background:rgba(34,197,94,.16);color:var(--ok);border-color:rgba(34,197,94,.4)}
.sec{border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.sec.fut{opacity:.4}.sec.cur{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro)}
.sec .cab{display:flex;align-items:center;gap:10px;padding:8px 12px}
.num{width:24px;height:24px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.cur .num{background:var(--ouro);color:#1B1409}.sec.ok .num{background:var(--ok);color:#06210f}
.sec.ok{border-color:rgba(34,197,94,.4)}
.res{color:var(--mut);margin-left:auto;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--ouro)}
.card .nm{font-size:15px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fim{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
@media(max-width:820px){.l-a{grid-template-columns:1fr!important}}
</style></head><body>
<div class="top"><b>Atendimento interno · escolha o layout</b>
<button class="tab on" data-l="A">A · Fila + passo a passo</button>
<button class="tab" data-l="B">B · Duas fases (quem chegou → atendimento)</button>
<button class="tab" data-l="C">C · Ficha única orientada</button></div>
<div class="wrap" id="app"></div>
<script>
var CLIS=[
 {id:1,n:"Juliane Ferreira",h:"09:30",st:"ch",tipo:"acerto",conds:[["00558",92],["00571",48],["00602",35]]},
 {id:2,n:"Camille Vitória Peixoto",h:"10:15",st:"ag",tipo:"acerto",conds:[["00433",60],["00477",41]]},
 {id:3,n:"Ketlyn Souza",h:"11:00",st:"ag",tipo:"kit_novo",conds:[["00690",80]]},
 {id:4,n:"Bruna Almeida Lima",h:"13:30",st:"ag",tipo:"acerto",conds:[["00512",55],["00520",30],["00544",72]]},
 {id:5,n:"Maria Luysa",h:"15:00",st:"ag",tipo:"reposicao",conds:[["00618",44]]}];
var TIPOS=[["acerto","Acerto"],["kit_novo","Kit novo"],["reposicao","Reposição"],["premio","Retirada de prêmio"],["indicacao","Indicação"]];
var FORMAS=["Pix","Dinheiro","Cartão","Link de pagamento","Crédito"];
var PASSOS=["Chegada","Condicionais","Pagamento","Brindes","Condicional nova","Regras"];
var S={l:"A",cli:1,passo:0,fase:"fila",tipo:{},sel:{},extra:{},forma:{},nova:{},regras:{}};
function $(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function cli(){return CLIS.find(function(c){return c.id===S.cli})}
function selDe(c){if(!S.sel[c.id])S.sel[c.id]=c.conds.map(function(x){return x[0]});return S.sel[c.id]}
function extraDe(c){return S.extra[c.id]||(S.extra[c.id]=[])}
function tag(st){var m={ag:["Agendada","t-ag"],ch:["Chegou","t-ch"],at:["Atendendo","t-at"],ok:["Feita","t-ok"]}[st];return '<span class="tag '+m[1]+'">'+m[0]+'</span>'}
function fila(){return '<div class="fila">'+CLIS.map(function(c){return '<div class="cli'+(c.id===S.cli?' on':'')+'" data-cli="'+c.id+'"><span class="h">'+c.h+'</span><span class="n" title="'+c.n+'">'+c.n+'</span>'+tag(c.st)+'</div>'}).join("")+'</div>'}

/* ---------- conteúdo de cada passo (usado pelos 3 layouts) ---------- */
function passo(i,c){
 if(i==0)return '<span class="lbl">O que ela veio fazer</span><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">'+TIPOS.map(function(t){return '<button class="opt'+((S.tipo[c.id]||c.tipo)==t[0]?' on':'')+'" data-tipo="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div><div class="row2" style="margin-top:10px"><div><span class="lbl">Horário marcado</span><input class="inp" value="'+c.h+'" disabled></div><div><span class="lbl">Chegou às</span><input class="inp" value="09:42"></div></div>';
 if(i==1){var s=selDe(c);return '<span class="lbl">Condicionais da DevMaster · toque para confirmar</span><div class="grid">'+c.conds.map(function(x){var on=s.indexOf(x[0])>=0;return '<div class="cond'+(on?' on':'')+'" data-cond="'+x[0]+'"><span class="chk">'+(on?'✓':'')+'</span><b>Condicional '+x[0]+'</b><span class="res">'+x[1]+' peças</span></div>'}).join("")+extraDe(c).map(function(x){return '<div class="cond on"><span class="chk">✓</span><b>Condicional '+x+'</b><span class="res">digitada à mão</span></div>'}).join("")+'</div><div style="display:flex;gap:8px;margin-top:10px;align-items:end"><div style="flex:1"><span class="lbl">Tem mais alguma? Digite o número</span><input class="inp" id="xc" inputmode="numeric" placeholder="Nº da condicional"></div><button class="btn sec" data-add>+ Adicionar</button></div>';}
 if(i==2)return '<div class="row3"><div><span class="lbl">Vendeu (do app)</span><input class="inp" value="R$ 6.420,00" disabled></div><div><span class="lbl">Crédito de garantia</span><input class="inp" value="R$ 0,00"></div><div><span class="lbl">Valor a pagar</span><input class="inp" value="R$ 6.420,00" disabled></div></div><span class="lbl" style="margin-top:12px">Forma de pagamento</span><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">'+FORMAS.map(function(f){return '<button class="opt'+(S.forma[c.id]==f?' on':'')+'" data-forma="'+f+'">'+f+'</button>'}).join("")+'</div><div class="row2" style="margin-top:10px"><div><span class="lbl">Valor desta forma</span><input class="inp" placeholder="R$ 0,00"></div><div style="display:flex;align-items:end"><button class="btn sec" style="width:100%">+ Lançar e enviar ao financeiro</button></div></div>';
 if(i==3)return '<div class="row2"><div><span class="lbl">Brinde Normal · código</span><input class="inp" placeholder="Código da peça"></div><div><span class="lbl">Brinde Select (BB) · código</span><input class="inp" placeholder="BB..."></div></div><p class="nota" style="margin-top:8px">Os campos de brinde abrem quando os pagamentos estiverem conferidos pelo financeiro.</p>';
 if(i==4)return '<span class="lbl">Ela continua com condicional?</span><div class="grid" style="grid-template-columns:repeat(3,1fr)">'+[["sim","Continua"],["regra","Não pode (regras)"],["nao","Não quer"]].map(function(o){return '<button class="opt'+(S.nova[c.id]==o[0]?' on':'')+'" data-nova="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'+(S.nova[c.id]=="sim"?'<div style="margin-top:10px"><span class="lbl">Número da condicional nova</span><input class="inp" placeholder="Nº"></div>':'');
 if(i==5){var R=["Peça fora do kit com etiqueta = vendida","Chegada com mais de 30 min perde 10% do brinde","Condicional devolvida em até 90 dias","Termo do consignado lido e aceito"];return '<div class="grid">'+R.map(function(r,k){var on=S.regras[c.id+"_"+k];return '<div class="cond'+(on?' on':'')+'" data-regra="'+k+'"><span class="chk">'+(on?'✓':'')+'</span><b>'+r+'</b></div>'}).join("")+'</div><div style="margin-top:10px"><span class="lbl">Assinatura da revendedora</span><div style="height:70px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mut)">Assine aqui com o mouse</div></div>';}
}
function feito(i,c){return i<S.passo}
function resumo(i,c){return ["Acerto · 09:42","3 condicionais confirmadas","Pix · R$ 6.420,00","Sem brinde","Continua · nº 00701","Assinado"][i]}

/* ---------- LAYOUT A ---------- */
function A(){var c=cli();return '<p class="nota">Fila sempre à vista. Você toca na cliente e o atendimento anda um passo por vez, sem sair da tela.</p><div class="grid l-a" style="grid-template-columns:300px 1fr;align-items:start"><div class="bloco"><div class="bar">Hoje · '+CLIS.length+' atendimentos</div><div class="pad">'+fila()+'</div></div><div class="bloco"><div class="bar"><span>'+c.n+' · '+c.h+'</span>'+tag(S.passo?'at':c.st)+'</div><div class="pad"><div class="steps" style="margin-bottom:12px">'+PASSOS.map(function(p,i){return '<div class="st'+(i==S.passo?' on':i<S.passo?' ok':'')+'">'+(i<S.passo?'✓ ':'')+p+'</div>'}).join("")+'</div>'+passo(S.passo,c)+'<div class="fim"><button class="btn sec big" data-volta '+(S.passo?'':'disabled')+'>‹ Voltar</button><button class="btn big" data-prox>'+(S.passo==5?'Finalizar atendimento':'Confirmar e seguir ›')+'</button></div></div></div></div>'}

/* ---------- LAYOUT B ---------- */
function B(){var c=cli();
 if(S.fase=="fila")return '<p class="nota">Fase 1: tela só para ver quem chegou. Cartões grandes. Tocar abre a confirmação das condicionais.</p><div class="bar" style="border-radius:12px 12px 0 0">Hoje · '+CLIS.length+' atendimentos</div><div class="pad bloco" style="border-radius:0 0 12px 12px"><div class="cards">'+CLIS.map(function(x){return '<div class="card" data-abrir="'+x.id+'"><div style="display:flex;justify-content:space-between"><b style="color:var(--ouro);font-size:15px">'+x.h+'</b>'+tag(x.st)+'</div><div class="nm">'+x.n+'</div><div style="color:var(--mut)">'+x.conds.length+' condicionais na DevMaster</div><button class="btn" data-abrir="'+x.id+'">Iniciar atendimento</button></div>'}).join("")+'</div></div>';
 return '<p class="nota">Fase 2: tela cheia só da cliente. Trilho no alto mostra onde está. Botão grande embaixo.</p><div class="bloco"><div class="bar"><span><button class="btn sec" data-fila style="height:26px;margin-right:8px">‹ Fila</button>'+c.n+'</span>'+tag('at')+'</div><div class="pad" style="max-width:760px;margin:auto"><div class="steps" style="margin-bottom:16px">'+PASSOS.map(function(p,i){return '<div class="st'+(i==S.passo?' on':i<S.passo?' ok':'')+'">'+(i<S.passo?'✓':i+1)+' · '+p+'</div>'}).join("")+'</div><h2 style="margin:0 0 10px;font-size:18px">'+(S.passo+1)+'. '+PASSOS[S.passo]+'</h2>'+passo(S.passo,c)+'<div class="fim"><button class="btn sec big" data-volta>‹ Voltar</button><button class="btn big" data-prox>'+(S.passo==5?'Finalizar atendimento':'Confirmar e seguir ›')+'</button></div></div></div>'}

/* ---------- LAYOUT C ---------- */
function C(){var c=cli();return '<p class="nota">Parece um cadastro. Faixa de clientes no alto; abaixo, seções numeradas. Só a atual fica aberta; as feitas viram uma linha de resumo; as próximas ficam apagadas.</p><div class="bloco" style="margin-bottom:10px"><div class="pad" style="display:flex;gap:8px;overflow-x:auto">'+CLIS.map(function(x){return '<div class="cli'+(x.id===S.cli?' on':'')+'" data-cli="'+x.id+'" style="min-width:210px"><span class="h">'+x.h+'</span><span class="n">'+x.n+'</span>'+tag(x.st)+'</div>'}).join("")+'</div></div><div style="max-width:820px;margin:auto"><h2 style="margin:0 0 10px;font-size:18px">'+c.n+'</h2>'+PASSOS.map(function(p,i){var k=i<S.passo?'ok':i==S.passo?'cur':'fut';return '<div class="sec '+k+'"><div class="cab"><span class="num">'+(i<S.passo?'✓':i+1)+'</span><b>'+p+'</b>'+(k=='ok'?'<span class="res">'+resumo(i,c)+'</span><button class="btn sec" style="height:26px" data-edit="'+i+'">Editar</button>':'')+'</div>'+(k=='cur'?'<div class="pad" style="padding-top:2px">'+passo(i,c)+'<div class="fim"><span></span><button class="btn big" data-prox>'+(i==5?'Finalizar atendimento':'Confirmar e seguir ›')+'</button></div></div>':'')+'</div>'}).join("")+'</div>'}

function draw(){var h={A:A,B:B,C:C}[S.l]();document.getElementById("app").innerHTML=h;
 document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.l==S.l)})}
document.addEventListener("click",function(ev){var t=ev.target.closest("[data-l],[data-cli],[data-abrir],[data-fila],[data-prox],[data-volta],[data-edit],[data-tipo],[data-cond],[data-add],[data-forma],[data-nova],[data-regra]");if(!t)return;var d=t.dataset,c=cli();
 if(d.l){S.l=d.l;S.passo=0;S.fase="fila"}
 else if(d.cli){S.cli=+d.cli;S.passo=0}
 else if(d.abrir){S.cli=+d.abrir;S.passo=0;S.fase="atend"}
 else if(t.hasAttribute("data-fila"))S.fase="fila";
 else if(t.hasAttribute("data-prox")){if(S.passo<5)S.passo++;else{c.st="ok";S.passo=0;S.fase="fila"}}
 else if(t.hasAttribute("data-volta")){if(S.passo)S.passo--}
 else if(d.edit)S.passo=+d.edit;
 else if(d.tipo)S.tipo[c.id]=d.tipo;
 else if(d.cond){var s=selDe(c),i=s.indexOf(d.cond);i>=0?s.splice(i,1):s.push(d.cond)}
 else if(t.hasAttribute("data-add")){var v=document.getElementById("xc").value.replace(/\D/g,"");if(v.length>=3)extraDe(c).push(v)}
 else if(d.forma)S.forma[c.id]=d.forma;
 else if(d.nova)S.nova[c.id]=d.nova;
 else if(d.regra!==undefined){var k=c.id+"_"+d.regra;S.regras[k]=!S.regras[k]}
 draw()});
draw();
</script></body></html>
