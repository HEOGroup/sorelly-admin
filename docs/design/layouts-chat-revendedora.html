<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layouts do SorellyChat, app da revendedora</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#eee;font-family:-apple-system,"Inter","Segoe UI",system-ui,sans-serif;padding:20px}
h1{font-size:18px;margin-bottom:4px}
.sub{font-size:13px;color:#aaa;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:28px;justify-items:center}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.leg{font-size:13px;text-align:center;max-width:330px;color:#ddd}
.leg b{color:#E8B84B}
.phone{width:320px;height:660px;border-radius:38px;border:9px solid #000;background:#fff;color:#111;overflow:hidden;position:relative;box-shadow:0 0 0 1.5px #444}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font-size:13px;font-weight:600;flex-shrink:0}
.btn{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);display:grid;place-items:center;font-size:15px;font-weight:700}
.btn.k{background:#111;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 14px}
.top .r{display:flex;gap:8px}
h2{font-size:30px;font-weight:800;padding:2px 16px 6px;letter-spacing:-.5px}
.arch{display:flex;align-items:center;gap:14px;padding:6px 16px;color:#6b6f76;font-size:15px;font-weight:600}
.arch i{width:30px;text-align:center;font-style:normal}
.arch em{margin-left:auto;font-style:normal;font-size:13px}
.list{flex:1;overflow:hidden}
.row{display:flex;gap:11px;padding:0 0 0 14px;align-items:center;cursor:pointer}
.row:active{background:#f1f2f4}
.av{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.rb{flex:1;min-width:0;padding:9px 14px 9px 0;border-bottom:.5px solid #e4e5e8}
.l1{display:flex;gap:8px;align-items:baseline}
.nm{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:#8a8f98}
.tm.g{color:#1fa855}
.l2{display:flex;gap:8px;align-items:center;margin-top:1px}
.pv{flex:1;font-size:13.5px;color:#6b6f76;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv .t{color:#34a0e8;margin-right:3px}
.bd{min-width:19px;height:19px;border-radius:10px;background:#25D366;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.pill{position:absolute;left:12px;right:12px;bottom:12px;height:56px;border-radius:30px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);display:flex;justify-content:space-around;align-items:center;font-size:10.5px;color:#444}
.pill div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 9px;border-radius:20px}
.pill div.on{background:#e9ebee;color:#111;font-weight:700}
.pill b{font-size:17px;line-height:1}
.bar{height:58px;border-top:.5px solid #ddd;display:flex;justify-content:space-around;align-items:center;font-size:10.5px;color:#666;flex-shrink:0;background:#f8f8f8}
.bar div{display:flex;flex-direction:column;align-items:center;gap:2px}
.bar div.on{color:#1fa855;font-weight:700}
.bar b{font-size:17px;line-height:1}
.search{margin:2px 14px 8px;height:34px;border-radius:10px;background:#eceef1;color:#8a8f98;font-size:14px;display:flex;align-items:center;padding:0 10px;gap:6px}
.chips{display:flex;gap:7px;padding:0 14px 8px}
.chip{height:30px;border-radius:15px;background:#eceef1;padding:0 13px;display:flex;align-items:center;font-size:13.5px;font-weight:600;color:#444}
.chip.on{background:#d8fdd2;color:#0b6b2a}
.brand{background:#0B0B0D;color:#fff;padding:2px 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .bk{width:30px;height:30px;border-radius:50%;background:#2A2A2E;display:grid;place-items:center;font-size:15px}
.brand b{font-size:12.5px;letter-spacing:.22em;color:#E8B84B}
.brand span{margin-left:auto;font-size:12px;opacity:.7}
.fab{position:absolute;right:16px;bottom:18px;width:52px;height:52px;border-radius:16px;background:#25D366;color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.favs{display:flex;gap:14px;padding:4px 16px 10px;overflow:hidden}
.fav{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;width:56px;text-align:center;cursor:pointer}
.fav .av{width:52px;height:52px;outline:2.5px solid #25D366;outline-offset:2px}
.sec{font-size:12px;font-weight:700;color:#8a8f98;padding:2px 16px 4px;text-transform:uppercase;letter-spacing:.06em}
/* conversa */
.chat{background:#efeae2;display:none;flex-direction:column;position:absolute;inset:0;z-index:5}
.chat.on{display:flex}
.ch-top{background:#f6f6f6;display:flex;align-items:center;gap:8px;padding:38px 10px 8px;border-bottom:.5px solid #ddd;flex-shrink:0}
.ch-top .back{font-size:22px;color:#1a8ae6;cursor:pointer;padding:0 4px}
.ch-top .av{width:36px;height:36px;font-size:13px}
.ch-top b{font-size:15px;display:block;line-height:1.1}
.ch-top small{font-size:11.5px;color:#6b6f76}
.msgs{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:5px;overflow:hidden;background-image:radial-gradient(#d9d2c5 1px,transparent 1px);background-size:18px 18px}
.m{max-width:78%;padding:6px 9px 4px;border-radius:12px;font-size:14px;line-height:1.3;position:relative}
.m small{font-size:10.5px;opacity:.6;margin-left:8px;float:right;margin-top:6px}
.m.me{align-self:flex-end;background:#d9fdd3;border-top-right-radius:3px}
.m.el{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.dia{align-self:center;background:#fff;font-size:11.5px;padding:3px 10px;border-radius:8px;color:#555;margin:4px 0}
.inp{background:#f6f6f6;padding:8px 10px 18px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.inp i{flex:1;height:34px;border-radius:18px;background:#fff;border:.5px solid #ccc;font-style:normal;color:#9aa;font-size:13.5px;display:flex;align-items:center;padding:0 12px}
.inp b{width:34px;height:34px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:15px}
</style>
</head>
<body>
<h1>SorellyChat do app da revendedora: 4 layouts</h1>
<p class="sub">Toque em uma conversa dentro de cada celular para ver como abre. Cada contato é uma conversa, sem botões no meio da tela.</p>
<div class="grid" id="g"></div>
<script>
var C=[
 {n:"Minha representante",i:"V",c:"#8B5CF6",m:"Pode ir sim. Só precisa agendar com as meninas.",t:"00:22",u:2,tk:1,ch:[["el","Oi! Quando você vem acertar?"],["me","Meu acerto é só mês que vem"],["el","Pode ir sim. Só precisa agendar com as meninas."]],sub:"Vanessa · representante"},
 {n:"Indique uma revendedora",i:"♥",c:"#EC4899",m:"Você já indicou 3 amigas. Falta 1 para o prêmio.",t:"Ontem",u:0,tk:0,ch:[["el","Indique uma amiga e ganhe prêmios."],["me","Quero indicar a Ana"]],sub:"Michele · Kit novo"},
 {n:"Link de pagamento",i:"$",c:"#0EA5E9",m:"Link gerado: R$ 320,00 em 3x.",t:"Ontem",u:1,tk:0,ch:[["me","Preciso de um link de R$ 320 em 3x"],["el","Link gerado: R$ 320,00 em 3x."]],sub:"Helen · Financeiro"},
 {n:"Garantias",i:"G",c:"#F59E0B",m:"Você: Mandei a foto da peça.",t:"Seg",u:0,tk:1,ch:[["me","Mandei a foto da peça."]],sub:"Deysiane e Leci"},
 {n:"Trabalhe na Sorelly",i:"T",c:"#14B8A6",m:"Toque para conversar",t:"",u:0,tk:0,ch:[],sub:"Maria Claudia · RH"},
 {n:"SAC",i:"S",c:"#22C55E",m:"Toque para conversar",t:"",u:0,tk:0,ch:[],sub:"Atendimento"}
];
function av(c,x){return '<div class="av" style="background:'+c.c+';'+(x||'')+'">'+c.i+'</div>'}
function row(c,k,x){return '<div class="row" data-k="'+k+'">'+av(c,x)+'<div class="rb"><div class="l1"><span class="nm">'+c.n+'</span><span class="tm'+(c.u?' g':'')+'">'+c.t+'</span></div><div class="l2"><span class="pv">'+(c.tk?'<span class="t">✓✓</span>':'')+c.m+'</span>'+(c.u?'<span class="bd">'+c.u+'</span>':'')+'</div></div></div>'}
function rows(x){return C.map(function(c,k){return row(c,k,x)}).join('')}
function chat(){return '<div class="chat"><div class="ch-top"><span class="back">‹</span><span class="avh"></span><div><b class="cn"></b><small class="cs"></small></div></div><div class="msgs"></div><div class="inp"><span style="font-size:22px">+</span><i>Mensagem</i><b>🎤</b></div></div>'}
var L=[
 {t:"A · Igual ao WhatsApp do iPhone",d:"<b>Cópia fiel</b>: botões redondos no topo, título grande, Arquivadas e barra inferior flutuante com as áreas do app.",
  h:'<div class="status"><span>00:45</span><span>▂▄▆ 96%</span></div><div class="top"><div class="btn">⋯</div><div class="r"><div class="btn">◉</div><div class="btn k">+</div></div></div><h2>Conversas</h2><div class="arch"><i>▤</i>Arquivadas<em>2</em></div><div class="list">'+rows()+'</div><div class="pill"><div><b>⌂</b>Início</div><div class="on"><b>◔</b>Conversas</div><div><b>▦</b>Catálogo</div><div><b>☰</b>Pedidos</div><div><b>⚙</b>Mais</div></div>'},
 {t:"B · Com busca e filtros",d:"<b>Mais útil</b>: busca e chips (Todas, Não lidas, Setores) no topo; barra inferior verde simples.",
  h:'<div class="status"><span>00:45</span><span>▂▄▆ 96%</span></div><div class="top"><div class="btn">⋯</div><div class="r"><div class="btn k">+</div></div></div><h2>Conversas</h2><div class="search">⌕ Buscar</div><div class="chips"><div class="chip on">Todas</div><div class="chip">Não lidas 3</div><div class="chip">Setores</div></div><div class="list">'+rows()+'</div><div class="bar"><div><b>⌂</b>Início</div><div class="on"><b>◔</b>Conversas</div><div><b>▦</b>Catálogo</div><div><b>☰</b>Pedidos</div></div>'},
 {t:"C · Compacto com a marca Sorelly",d:"<b>Aproveita o espaço</b>: sem título grande, topo preto com SORELLY e voltar ao app, linhas mais baixas, botão verde de nova conversa.",
  h:'<div class="status" style="background:#0B0B0D;color:#fff"><span>00:45</span><span>▂▄▆ 96%</span></div><div class="brand"><div class="bk">‹</div><b>SORELLY CHAT</b><span>Conversas</span></div><div class="search" style="margin-top:8px">⌕ Buscar conversa</div><div class="list" style="padding-bottom:60px">'+rows('width:42px;height:42px;font-size:15px')+'</div><div class="fab">✎</div>'},
 {t:"D · Favoritos no topo",d:"<b>Acesso rápido</b>: as 4 conversas principais viram bolinhas fixas no topo; embaixo, a lista completa.",
  h:'<div class="status"><span>00:45</span><span>▂▄▆ 96%</span></div><div class="top"><div class="btn">⋯</div><div class="r"><div class="btn k">+</div></div></div><h2>Conversas</h2><div class="sec">Favoritos</div><div class="favs">'+C.slice(0,4).map(function(c,k){return '<div class="fav" data-k="'+k+'">'+av(c)+c.n.split(" ")[0]+'</div>'}).join('')+'</div><div class="sec">Todas</div><div class="list">'+rows()+'</div><div class="bar"><div><b>⌂</b>Início</div><div class="on"><b>◔</b>Conversas</div><div><b>▦</b>Catálogo</div><div><b>☰</b>Pedidos</div></div>'}
];
var g=document.getElementById('g');
L.forEach(function(l){
  var col=document.createElement('div');col.className='col';
  col.innerHTML='<div class="phone"><div class="screen">'+l.h+'</div>'+chat()+'</div><div class="leg"><b>'+l.t+'</b><br>'+l.d+'</div>';
  g.appendChild(col);
  var ph=col.querySelector('.phone'), ch=ph.querySelector('.chat');
  function abrir(k){var c=C[k];ch.querySelector('.avh').innerHTML=av(c);ch.querySelector('.cn').textContent=c.n;ch.querySelector('.cs').textContent=c.sub;
    ch.querySelector('.msgs').innerHTML='<div class="dia">Hoje</div>'+(c.ch.length?c.ch.map(function(m){return '<div class="m '+m[0]+'">'+m[1]+'<small>00:2'+(m[0]=="me"?"2 ✓✓":"1")+'</small></div>'}).join(''):'<div class="dia">Nenhuma mensagem ainda. Diga um oi.</div>');ch.classList.add('on')}
  ph.addEventListener('click',function(ev){var r=ev.target.closest('[data-k]');if(r){abrir(+r.getAttribute('data-k'));return}
    if(ev.target.classList.contains('back'))ch.classList.remove('on')});
});
</script>
</body>
</html>
