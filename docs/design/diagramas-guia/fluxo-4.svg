<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Fluxo Reposição (App → Admin → App)"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2383E2"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9730D"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#787774"/></marker></defs><rect width="640" height="630" fill="#fff"/><text x="0" y="22" font-size="18" font-weight="700" fill="#2383E2">APP (representante)</text><text x="640" y="22" font-size="18" font-weight="700" text-anchor="end" fill="#D9730D">ADMIN (empresa)</text><rect x="0" y="50" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="78" font-size="16" fill="#37352F" >1. APP-21 Entregar reposição +</text><text x="12" y="100" font-size="16" fill="#37352F" >APP-19 Conferência</text><text x="12" y="122" font-size="16" fill="#787774" >→ contagem das peças</text><rect x="0" y="166" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="194" font-size="16" fill="#37352F" >2. APP-21: condicional assinada</text><text x="12" y="216" font-size="16" fill="#37352F" >e Concluir</text><text x="12" y="238" font-size="16" fill="#787774" >→ REPOSICAO_ENTREGAR (R$ 15)</text><line x1="145" y1="132" x2="145" y2="166" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="282" width="290" height="104" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="310" font-size="16" fill="#37352F" >3. ADM-06 Consolidado: linha de</text><text x="362" y="332" font-size="16" fill="#37352F" >reposição; agendamento confere</text><text x="362" y="354" font-size="16" fill="#37352F" >a condicional</text><text x="362" y="376" font-size="16" fill="#787774" >→ recebimento</text><path d="M145 248 L145 262 L495 268 L495 282" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="350" y="420" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="448" font-size="16" fill="#37352F" >4. ADM-09 Comissões: financeiro</text><text x="362" y="470" font-size="16" fill="#37352F" >confirma</text><text x="362" y="492" font-size="16" fill="#787774" >→ comissão R$ 15</text><line x1="495" y1="386" x2="495" y2="420" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="536" width="290" height="60" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="564" font-size="16" fill="#37352F" >5. APP-22 Comissões</text><text x="12" y="586" font-size="16" fill="#787774" >→ linha 'Reposição'</text><path d="M495 502 L495 516 L145 522 L145 536" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/></svg>