<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1226" viewBox="0 0 640 1226" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Fluxo Acerto até a comissão (App → Admin → App → Admin)"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2383E2"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9730D"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#787774"/></marker></defs><rect width="640" height="1226" fill="#fff"/><text x="0" y="22" font-size="18" font-weight="700" fill="#2383E2">APP (representante)</text><text x="640" y="22" font-size="18" font-weight="700" text-anchor="end" fill="#D9730D">ADMIN (empresa)</text><rect x="0" y="50" width="290" height="126" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="78" font-size="16" fill="#37352F" >1. APP-14 Calculadora de</text><text x="12" y="100" font-size="16" fill="#37352F" >Acertos + APP-16 Assinatura</text><text x="12" y="122" font-size="16" fill="#787774" >→ ACERTO_REGISTRAR cria a linha</text><text x="12" y="144" font-size="16" fill="#787774" >em s.acertosConsignado; kit</text><text x="12" y="166" font-size="16" fill="#787774" >'acertado'</text><rect x="0" y="210" width="290" height="60" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="238" font-size="16" fill="#37352F" >2. APP-17 Fechar atendimento</text><text x="12" y="260" font-size="16" fill="#787774" >→ mensagens e PDF</text><line x1="145" y1="176" x2="145" y2="210" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="304" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="332" font-size="16" fill="#37352F" >3. ADM-06 Consolidado</text><text x="362" y="354" font-size="16" fill="#37352F" >Representante: aparece pendente</text><text x="362" y="376" font-size="16" fill="#787774" >→ aguarda a chegada dos kits</text><path d="M145 270 L145 284 L495 290 L495 304" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="420" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="448" font-size="16" fill="#37352F" >4. APP-23 Entrega na empresa</text><text x="12" y="470" font-size="16" fill="#787774" >→ representante marca</text><text x="12" y="492" font-size="16" fill="#787774" >'Entreguei' (CONSREP_RECEBER)</text><path d="M495 386 L495 400 L145 406 L145 420" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="536" width="290" height="126" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="564" font-size="16" fill="#37352F" >5. ADM-06: agendamento marca</text><text x="362" y="586" font-size="16" fill="#37352F" >dinheiro e condicionais; OK de</text><text x="362" y="608" font-size="16" fill="#37352F" >recebimento</text><text x="362" y="630" font-size="16" fill="#787774" >→ recebimento.ok; entra na fila</text><text x="362" y="652" font-size="16" fill="#787774" >de retornos</text><path d="M145 502 L145 516 L495 522 L495 536" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="350" y="696" width="290" height="104" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="724" font-size="16" fill="#37352F" >6. ADM-09 Comissões: financeiro</text><text x="362" y="746" font-size="16" fill="#37352F" >concilia cada linha e confirma</text><text x="362" y="768" font-size="16" fill="#787774" >→ r.fin[idx]; comissão</text><text x="362" y="790" font-size="16" fill="#787774" >confirmada</text><line x1="495" y1="662" x2="495" y2="696" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="834" width="290" height="104" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="862" font-size="16" fill="#37352F" >7. APP-22 Comissões: ✓</text><text x="12" y="884" font-size="16" fill="#37352F" >Agendamento e ✓ Financeiro</text><text x="12" y="906" font-size="16" fill="#787774" >→ comissão passa de pendente a</text><text x="12" y="928" font-size="16" fill="#787774" >confirmada</text><path d="M495 800 L495 814 L145 820 L145 834" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="972" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="1000" font-size="16" fill="#37352F" >8. ADM-09: pagamento nas datas</text><text x="362" y="1022" font-size="16" fill="#37352F" >(1/11/21 ou 6/16/26)</text><text x="362" y="1044" font-size="16" fill="#787774" >→ c.fech[...].pagamentos</text><path d="M145 938 L145 952 L495 958 L495 972" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="1088" width="290" height="104" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="1116" font-size="16" fill="#37352F" >9. APP-22: 'Já pago' e</text><text x="12" y="1138" font-size="16" fill="#37352F" >'Restante' no consolidado do</text><text x="12" y="1160" font-size="16" fill="#37352F" >mês</text><text x="12" y="1182" font-size="16" fill="#787774" >→ fim do fluxo</text><path d="M495 1054 L495 1068 L145 1074 L145 1088" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/></svg>