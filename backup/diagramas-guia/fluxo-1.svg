<svg xmlns="http://www.w3.org/2000/svg" width="640" height="906" viewBox="0 0 640 906" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-label="Fluxo Pedir kit até a retirada (App → Admin → App)"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2383E2"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9730D"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#787774"/></marker></defs><rect width="640" height="906" fill="#fff"/><text x="0" y="22" font-size="18" font-weight="700" fill="#2383E2">APP (representante)</text><text x="640" y="22" font-size="18" font-weight="700" text-anchor="end" fill="#D9730D">ADMIN (empresa)</text><rect x="0" y="50" width="290" height="104" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="78" font-size="16" fill="#37352F" >1. APP-06 Pedir kit:</text><text x="12" y="100" font-size="16" fill="#37352F" >representante escolhe o tipo e</text><text x="12" y="122" font-size="16" fill="#37352F" >a listagem</text><text x="12" y="144" font-size="16" fill="#787774" >→ ADD_KIT cria o kit em s.kits</text><rect x="350" y="188" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="216" font-size="16" fill="#37352F" >2. ADM-03 Condicionais: confere</text><text x="362" y="238" font-size="16" fill="#37352F" >e libera</text><text x="362" y="260" font-size="16" fill="#787774" >→ condicional conferida</text><path d="M145 154 L145 168 L495 174 L495 188" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="350" y="304" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="332" font-size="16" fill="#37352F" >3. ADM-04 Calculadora de kits:</text><text x="362" y="354" font-size="16" fill="#37352F" >define o valor</text><text x="362" y="376" font-size="16" fill="#787774" >→ s.kits[].valor</text><line x1="495" y1="270" x2="495" y2="304" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="350" y="420" width="290" height="104" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="448" font-size="16" fill="#37352F" >4. ADM-02 Listagens: montagem e</text><text x="362" y="470" font-size="16" fill="#37352F" >bipagem</text><text x="362" y="492" font-size="16" fill="#787774" >→ status Na fila → Montando →</text><text x="362" y="514" font-size="16" fill="#787774" >Bipado</text><line x1="495" y1="386" x2="495" y2="420" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="558" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="586" font-size="16" fill="#37352F" >5. APP-09 Listagens: ela</text><text x="12" y="608" font-size="16" fill="#37352F" >acompanha ao vivo</text><text x="12" y="630" font-size="16" fill="#787774" >→ lê os mesmos status</text><path d="M495 524 L495 538 L145 544 L145 558" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/><rect x="350" y="674" width="290" height="82" rx="8" fill="#D9730D12" stroke="#D9730D" stroke-width="2"/><text x="362" y="702" font-size="16" fill="#37352F" >6. ADM-02: funcionária confirma</text><text x="362" y="724" font-size="16" fill="#37352F" >a retirada</text><text x="362" y="746" font-size="16" fill="#787774" >→ status Retirado + retEm</text><path d="M145 640 L145 654 L495 660 L495 674" fill="none" stroke="#D9730D" stroke-width="2.5" marker-end="url(#mb)"/><rect x="0" y="790" width="290" height="82" rx="8" fill="#2383E212" stroke="#2383E2" stroke-width="2"/><text x="12" y="818" font-size="16" fill="#37352F" >7. APP-10 Retirada e APP-11</text><text x="12" y="840" font-size="16" fill="#37352F" >Avaliar kits</text><text x="12" y="862" font-size="16" fill="#787774" >→ nota volta ao admin (AVALIAR)</text><path d="M495 756 L495 770 L145 776 L145 790" fill="none" stroke="#2383E2" stroke-width="2.5" marker-end="url(#ma)"/></svg>