<html lang="pt-BR" class="dark">

<style type="text/tailwindcss">
  @theme {
    --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --font-heading: "JetBrains Mono", ui-monospace, monospace;
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-popover: var(--popover);
    --color-popover-foreground: var(--popover-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-secondary: var(--secondary);
    --color-secondary-foreground: var(--secondary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-success: var(--success);
    --color-warning: var(--warning);
    --color-info: var(--info);
    --color-purple: var(--purple);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --color-sidebar: var(--sidebar);
    --color-sidebar-foreground: var(--sidebar-foreground);
    --color-sidebar-accent: var(--sidebar-accent);
    --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
    --color-sidebar-border: var(--sidebar-border);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) * 1.4);
  }
  :root {
    --background: oklch(0.98 0.004 95); --foreground: oklch(0.2 0 0);
    --card: oklch(1 0 0); --card-foreground: oklch(0.2 0 0);
    --popover: oklch(1 0 0); --popover-foreground: oklch(0.2 0 0);
    --primary: oklch(0.78 0.14 95); --primary-foreground: oklch(0.22 0.03 95);
    --secondary: oklch(0.95 0.004 95); --secondary-foreground: oklch(0.25 0 0);
    --muted: oklch(0.95 0.004 95); --muted-foreground: oklch(0.5 0 0);
    --accent: oklch(0.95 0.004 95); --accent-foreground: oklch(0.25 0 0);
    --destructive: oklch(0.58 0.22 27); --success: oklch(0.6 0.15 155);
    --warning: oklch(0.66 0.14 75); --info: oklch(0.55 0.15 255);
    --purple: oklch(0.52 0.18 305);
    --border: oklch(0.9 0.004 95); --input: oklch(0.88 0.004 95);
    --ring: oklch(0.78 0.14 95); --radius: 0.5rem;
    --sidebar: oklch(0.97 0.004 95); --sidebar-foreground: oklch(0.2 0 0);
    --sidebar-accent: oklch(0.78 0.14 95 / 12%);
    --sidebar-accent-foreground: oklch(0.5 0.1 95);
    --sidebar-border: oklch(0.9 0.004 95);
  }
  .dark {
    --background: oklch(0.17 0 0); --foreground: oklch(0.95 0 0);
    --card: oklch(0.2 0 0); --card-foreground: oklch(0.95 0 0);
    --popover: oklch(0.2 0 0); --popover-foreground: oklch(0.95 0 0);
    --primary: oklch(0.83 0.14 95); --primary-foreground: oklch(0.22 0.03 95);
    --secondary: oklch(0.27 0 0); --secondary-foreground: oklch(0.95 0 0);
    --muted: oklch(0.24 0 0); --muted-foreground: oklch(0.86 0 0); /* textos secundários quase brancos, a pedido */
    --accent: oklch(0.27 0 0); --accent-foreground: oklch(0.95 0 0);
    --destructive: oklch(0.63 0.19 27); --success: oklch(0.78 0.17 155);
    --warning: oklch(0.76 0.14 75); --info: oklch(0.7 0.14 255);
    --purple: oklch(0.72 0.16 305);
    --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 14%);
    --ring: oklch(0.83 0.14 95);
    --sidebar: oklch(0.16 0 0); --sidebar-foreground: oklch(0.95 0 0);
    --sidebar-accent: oklch(0.83 0.14 95 / 10%);
    --sidebar-accent-foreground: oklch(0.83 0.14 95);
    --sidebar-border: oklch(1 0 0 / 10%);
  }
  @layer base {
    html { font-family: var(--font-sans); }
    body { background-color: var(--background); color: var(--foreground); }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
    select { color: var(--foreground); background-color: transparent; }
    select option { background-color: var(--popover); color: var(--popover-foreground); }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    dialog { color: var(--popover-foreground); }
  }
</style>
<style>
  /* ── Padrão visual dos apps (montadora, bipagem, representante, revendedora), conforme os prints do app da representante ──
     conteúdo claro com cartões brancos; o primeiro bloco da tela vira o cabeçalho escuro */
  .app-claro .barra-status { color:#fff; }
  .app-claro #app-screen > :first-child { background:#0D0D0F; color:#fff; margin:-8px -16px 14px; padding:8px 16px 18px; border-radius:0 0 26px 26px; }
  .app-claro #app-screen > :first-child .text-\[\#8E8E93\] { color:#A1A1AA; }
  .app-claro #app-screen > :first-child .bg-\[\#1C1C1E\] { background:#26262B; border:0; box-shadow:none; }
  .app-claro #app-screen > :first-child .text-amber-200 { color:#F3D98B; }
  .app-claro .bg-\[\#1C1C1E\] { background:#FFFFFF; border:1px solid #E5E7EB; box-shadow:0 1px 2px rgba(17,24,39,.04); }
  .app-claro .bg-black\/50, .app-claro .bg-black\/40 { background:#F4F5F7; }
  .app-claro .bg-white\/10 { background:#F1F2F4; color:#1F2937; }
  .app-claro .text-white, .app-claro .text-white\/80, .app-claro .text-white\/75 { color:#1F2937; }
  .app-claro .text-white\/70, .app-claro .text-white\/60 { color:#4B5563; }
  .app-claro .text-white\/25, .app-claro .text-white\/20 { color:#D1D5DB; }
  .app-claro .text-\[\#8E8E93\] { color:#6B7280; }
  .app-claro .text-amber-200, .app-claro .text-amber-300 { color:#A67C12; }
  .app-claro .text-emerald-200, .app-claro .text-emerald-300 { color:#15803D; }
  .app-claro .text-rose-200, .app-claro .text-rose-300 { color:#DC2626; }
  .app-claro .text-sky-300 { color:#2563EB; }
  .app-claro .text-violet-200, .app-claro .text-violet-300 { color:#7C3AED; }
  .app-claro .bg-amber-400\/15, .app-claro .bg-amber-400\/20 { background:#FEF5DC; }
  .app-claro .bg-emerald-400\/10, .app-claro .bg-emerald-400\/15, .app-claro .bg-emerald-400\/20 { background:#E7F6EC; }
  .app-claro .bg-rose-500\/15, .app-claro .bg-rose-500\/25 { background:#FDECEC; }
  .app-claro .bg-violet-500\/15 { background:#F1EAFE; }
  .app-claro .border-white\/5, .app-claro .border-white\/10 { border-color:#EEF0F2; }
  .app-claro [class*="ring-white"] { --tw-ring-color:#E5E7EB; }
  .app-claro textarea, .app-claro input:not([type=checkbox]) { background:#F4F5F7; color:#111827; }
  .app-claro .placeholder\:text-\[\#8E8E93\]::placeholder { color:#9CA3AF; }
  /* Apps no padrão dos prints: cores sólidas e vivas, sem degradê */
  .app-claro [class*="bg-linear"] { background-image:none !important; }
  .app-claro [class*="from-[#B8862B]"], .app-claro [class*="from-amber-300"] { background-color:#C9A13B !important; }
  .app-claro [class*="from-emerald-400"], .app-claro [class*="from-emerald-500"] { background-color:#16A34A !important; }
  .app-claro [class*="from-sky-500"] { background-color:#2563EB !important; }
  .app-claro [class*="from-amber-500"] { background-color:#C9A13B !important; }
  .app-claro [class*="from-rose-500"] { background-color:#DC2626 !important; }
  .app-claro [class*="from-[#B8862B]"], .app-claro [class*="from-[#B8862B]"] *, .app-claro [class*="from-emerald-4"], .app-claro [class*="from-emerald-4"] *,
  .app-claro [class*="from-sky-500"], .app-claro [class*="from-sky-500"] *, .app-claro [class*="from-amber-500"], .app-claro [class*="from-amber-500"] *,
  .app-claro [class*="from-rose-500"], .app-claro [class*="from-rose-500"] *, .app-claro .txt-branco, .app-claro .txt-branco * { color:#fff !important; }
  .app-claro [class*="from-sky-500"], .app-claro [class*="from-amber-500"], .app-claro [class*="from-rose-500"], .app-claro [class*="from-emerald-500"] { --tw-ring-color:transparent; box-shadow:0 2px 6px rgba(17,24,39,.12); }
  .app-claro [class*="shadow-amber-500"] { box-shadow:0 4px 12px rgba(201,161,59,.35) !important; }

function ehEspecial(v,c){ return v > c.limiteEspecial; }
function ehAtencao(v,c){ return v > c.limiteAtencao; }
// Kits acima deste valor só aparecem para as montadoras mais bem avaliadas
function soMelhores(v,c){ return v > (c.limiteMelhores!==undefined ? c.limiteMelhores : c.limiteAtencao); }
// Linha da tabela de peças para um valor de kit: a maior linha que o valor alcança
function pecasPara(valor, c){
  if(!c.pecasKit || !valor) return null;
  var l = c.pecasKit.slice().sort(function(a,b){return b.kit-a.kit;}).find(function(x){return valor>=x.kit;});
  if(!l) return null;
  var itens = c.categorias.map(function(nome,i){ return {nome:nome, q:l.q[i]}; }).filter(function(x){return x.q!==null && x.q!==undefined && x.q!=="";});
  return itens.length ? {kit:l.kit, itens:itens} : null;
}
function tempoMont(k, agora){
  if(!k.iniM) return 0; if(k.fimM && k.tempoM!==null) return k.tempoM;
  var p = k.pausaMs + (k.pausadoEm ? (agora - k.pausadoEm) : 0);
  return Math.max(0, (k.fimM || agora) - k.iniM - p);
}
function conta(k){ return k.fimM && ["montado","bipando","bipado","retirado"].indexOf(k.status)>=0; }
function listagemDe(s, k){ return s.listagens.find(function(l){return l.id===k.lid;}); }

function resumoMontadora(m, s){
  var c = s.cfg, hojeK = s.kits.filter(function(k){return k.montId===m.id && conta(k);});
  var n = m.mes.n, en = m.mes.e;
  hojeK.forEach(function(k){ if(ehEspecial(k.valor,c)) en++; else n++; });
  var media = m.mes.aval ? m.mes.soma/m.mes.aval : 0;
  var faixa = c.faixas.slice().sort(function(a,b){return b.min-a.min;}).find(function(f){return media>=f.min;}) || {pct:100};
  var fator = m.mes.aval ? faixa.pct : 100;
  var perda = Math.min(100, Math.floor(m.mes.div / c.divBloco) * c.divPerda);
  var bruto = n*c.valorNormal + en*c.valorEspecial;
  var alerta = !m.mes.aval ? "sem" : media < c.alertaVermelho ? "vermelho" : media < c.alertaAmarelo ? "amarelo" : "ok";
  return {m:m, n:n, e:en, total:n+en, hoje:hojeK.length, hojeK:hojeK, media:media, fator:fator,
    div:m.mes.div, perda:perda, bruto:bruto, liquido:bruto*(fator/100)*(1-perda/100), alerta:alerta,
    atual: s.kits.find(function(k){return k.montId===m.id && k.status==="montando";}),
    faltamBloco: c.divBloco - (m.mes.div % c.divBloco)};
}
// Bipadora: R$ por kit (maior acima do limite) menos R$ por peça faltando apontada pela representante
function resumoBipadora(b, s){
  var c = s.cfg, hojeK = s.kits.filter(function(k){return k.bipId===b.id && k.fimB;});
  var n = b.mes.n, en = b.mes.e;
  hojeK.forEach(function(k){ if(k.valor > c.limiteBipEspecial) en++; else n++; });
  // peças faltando: as do mês até ontem + as apontadas hoje pelas representantes nos kits que ela bipou
  var faltas = b.mes.faltas + hojeK.reduce(function(t,k){return t+(k.aval ? k.aval.faltas : 0);},0);
  var bruto = n*c.valorBipNormal + en*c.valorBipEspecial, perda = faltas*c.perdaFalta;
  return {b:b, n:n, e:en, total:n+en, hoje:hojeK.length, hojeK:hojeK, bruto:bruto, faltas:faltas, perda:perda,
    liquido:Math.max(0, bruto-perda), tempo:tempoMedioB(hojeK), divs:hojeK.filter(function(k){return k.divReg;}).length,
    esp:hojeK.reduce(function(t,k){return t+k.valor;},0), real:hojeK.reduce(function(t,k){return t+(k.valorReal||0);},0),
    atual:s.kits.find(function(k){return k.bipId===b.id && k.status==="bipando";})};
}

function papelDe(id){
  if(id===SUPERVISORA.id || DIRETORIA.some(function(x){return x.id===id;})) return "supervisao";
  if(id===KITNOVO.id) return "kitnovo";
  if(id===LISTAGENS_RESP.id) return "listagens";

function rankingNota(s){

  var tot = s.montadoras.reduce(function(t,m){return t+m.mes.n+m.mes.e;},0);

  return rankingNota(s).slice(0, s.cfg.topN).some(function(m){return m.id===id;});

function filaMontagem(s){
  var itens = [];
  s.listagens.filter(function(l){return !l.fechada;}).forEach(function(l){
    var pi=0, ni=0;
    s.kits.filter(function(k){return k.lid===l.id && k.status==="pendente" && !k.designada;})
      .sort(function(a,b){return a.ordem-b.ordem;})
      .forEach(function(k){ itens.push({k:k, c:[minutos(l.horario), k.prio?0:1, k.prio?pi++:ni++, l.id]}); });
  });
  itens.sort(function(a,b){ for(var i=0;i<4;i++){ if(a.c[i]<b.c[i]) return -1; if(a.c[i]>b.c[i]) return 1; } return 0; });
  return itens.map(function(x){return x.k;});

function proximoPara(id, s){
  var aj = s.kits.find(function(k){return k.status==="ajuste" && k.montId===id;});
  if(aj) return {kit:aj, tipo:"ajuste"};
  var ped = s.kits.find(function(k){return k.status==="pendente" && k.designada===id && !listagemDe(s,k).fechada;});
  if(ped) return {kit:ped, tipo:"pedido"};
  var fila = filaMontagem(s), pulou = false;
  for(var i=0;i<fila.length;i++){
    if(soMelhores(fila[i].valor, s.cfg) && !podeAtencao(id, s)){ pulou = true; continue; }
    return {kit:fila[i], tipo:"fila", posicao:i+1, pulou:pulou};
  }
  return {kit:null, pulou:pulou};
}
function filaBipagem(s){
  return s.kits.filter(function(k){return k.status==="montado";}).sort(function(a,b){
    return minutos(listagemDe(s,a).horario)-minutos(listagemDe(s,b).horario) || (a.prio===b.prio?0:(a.prio?-1:1)) || a.fimM-b.fimM;
  });
}
