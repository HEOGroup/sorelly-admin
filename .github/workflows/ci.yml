# Confere cada mudança antes de ela chegar no master: lint, padrão visual (scripts/conferir-padrao.mjs), build e as fotos de referência (tests/fotos).
# Se falhar, o PR mostra um X vermelho e o erro aparece na aba "Actions" do GitHub. Fotos novas se aprovam pelo workflow "Fotos de referência".
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o conferidor do padrão compara com o commit base do PR (ou o anterior, no push)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Padrão visual (só o que mudou)
        run: node scripts/conferir-padrao.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Instalar o navegador das fotos
        run: npx playwright install --with-deps chromium

      - name: Fotos de referência
        run: npx playwright test
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Guardar o relatório das fotos (antes / depois / diferença)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-relatorio
          path: |
            playwright-report
            test-results
          retention-days: 14
